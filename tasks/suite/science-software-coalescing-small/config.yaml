# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 300
  max_retries: 2

prompt:
  system_message: |
    Software engineering: optimal register coalescing on the challenge graphs with fewer than 3,000 nodes

    Colour the 452 smaller interference graphs of the Appel-George Optimal Coalescing Challenge with 6 registers so that as much move (affinity) weight as possible joins nodes of the same colour. The score is the mean share of affinity weight left uncoalesced; lower is better.

    Candidate interface: coalesce(problem) -> list of int. problem = {'name': str, 'nodes': N, 'registers': K (6 in every instance), 'interference': [[i, j], ...], 'affinities': [[i, j, w], ...]} with nodes numbered 0..N-1: nodes 0..K-1 are machine registers and node i < K must get colour i; every other node interferes with fewer than K nodes, so a legal colouring always exists; affinities are move-related pairs with positive integer weights. Return N Python ints in 0..K-1 such that no interference pair shares a colour. Cost of an instance: total weight of the affinity pairs whose two nodes get different colours. Score: mean over the task's instances of cost divided by the instance's total affinity weight (the share of move weight not coalesced), minimised; 0 means every move is coalesced. An illegal colouring of any instance makes the evaluation invalid. coalesce() is called once per instance, all instances in one sandboxed subprocess (no files, network or subprocesses; 120 s CPU in total, 3 GB); it should be deterministic (seed any randomness, do not read clocks).

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
