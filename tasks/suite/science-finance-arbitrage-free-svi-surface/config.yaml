# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 300
  max_retries: 2

prompt:
  system_message: |
    Finance: Arbitrage-free SVI implied-volatility surface for DAX options

    Fit a raw SVI smile to each of the eight maturities of a real DAX option implied-volatility surface (2002-07-05, 104 quotes) without static arbitrage. The evaluator checks butterfly and calendar-spread arbitrage on a dense moneyness grid and scores the root-mean-square implied-volatility error in volatility points.

    Candidate interface: fit_surface(quotes) -> (8, 5) array of raw SVI parameters [a, b, rho, m, sigma], one row per maturity in increasing order; total implied variance w(k) = a + b*(rho*(k - m) + sqrt((k - m)^2 + sigma^2)) in log-forward moneyness k = ln(K/F). quotes = {'spot': 4468.17, 'maturities': (8,) years (days/365), 'maturity_days', 'zero_rates', 'forwards' (spot*exp(r*T), no dividends), 'strikes': (13,), 'implied_vol': (8, 13), 'log_moneyness': (8, 13), 'total_variance': (8, 13)} for DAX index options on 2002-07-05. Valid only without static arbitrage: b >= 0, |rho| < 1, sigma >= 1e-4, a + b*sigma*sqrt(1 - rho^2) > 0, wing slopes b(1 + |rho|) <= 2, Durrleman's g(k) >= -1e-10 and w_{i+1}(k) - w_i(k) >= -1e-10 on a dense grid of |k| <= 6 refined near every vertex, and wing slopes b(1 +- rho) non-decreasing in maturity. Score: root-mean-square error of the fitted implied volatilities sqrt(w/T) against the 104 quotes, in volatility points (minimize). The candidate runs in a separate sandboxed process: numpy, scipy, scikit-learn, pandas and the other installed packages are importable, while the evaluator's library, its data files, the network and subprocesses are not accessible; one thread and 3 GB of memory. It receives only the arguments described here, one call at a time: the arguments of a call are sent after the value of the previous call has been received. Arguments and return values travel as numbers, strings, lists, dicts with string keys and numeric numpy arrays, so a tuple arrives as a list

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
