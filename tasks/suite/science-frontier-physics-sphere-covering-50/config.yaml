# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Covering the sphere with 50 equal caps

    Place 50 points on the unit sphere so that the largest angular distance from any point of the sphere to its nearest chosen point (the covering radius) is as small as possible. The best known covering, with radius 18.3000226 degrees, was found by Hardin, Sloane and Smith in 1994 and is not proven optimal.

    Candidate interface: construct() -> array of shape (N, 3) of nonzero vectors; each is normalised to the unit sphere. Score: the covering radius in degrees, max over points y of the sphere of the angular distance from y to the nearest configuration point (the largest circumradius of the facets of the convex hull, each facet checked to have an empty cap); minimize. Coincident points, configurations inside a closed hemisphere, numerically inconsistent hulls, a wrong shape or non-finite values make the candidate invalid.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
