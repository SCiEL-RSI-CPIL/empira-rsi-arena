# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 240
  max_retries: 2

prompt:
  system_message: |
    Biology: probabilistic forecasts of state influenza hospital admissions

    Issue weekly quantile forecasts of laboratory-confirmed influenza hospital admissions one to four weeks ahead for every US state through the held-out 2024-2025 season, seeing only the surveillance history up to each forecast week. The evaluator scores the quantiles with the weighted interval score used by the CDC FluSight hub.

    Candidate interface: forecast(history, reference_date, quantiles, horizons) -> dict mapping every location code of history to a 4 x 23 list of predictive quantiles (rows = horizons 1..4 weeks ahead, columns = the 23 FluSight quantile levels, non-negative and non-decreasing along each row). history maps location codes ('US' plus the two-digit FIPS codes of the 50 states, DC and Puerto Rico) to the weekly admission counts up to and including the week ending on reference_date (None where the hub reports no value). forecast is called once per reference date, in chronological order, inside a sandboxed subprocess that never sees later weeks, with a 180 s CPU budget for the whole season. Score (minimize): mean weighted interval score (Bracher et al. 2021) over the 26 reference dates of the 2024-2025 season, the 52 state-level locations and the four horizons; the US aggregate is not scored

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
