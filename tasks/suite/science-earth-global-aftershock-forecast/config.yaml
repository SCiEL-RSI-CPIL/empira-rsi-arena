# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 480
  max_retries: 2

prompt:
  system_message: |
    Earth science: probabilistic aftershock forecasts after large earthquakes worldwide

    Fit an aftershock forecasting model on 1990-2014 sequences from the global ComCat catalogue and, for every large shallow earthquake of 2015-2024, forecast the probability distribution of the number of magnitude 5 or larger aftershocks in the week after day 1 and the month after day 7, using only events before each forecast. The score is the mean logarithmic score of the observed counts.

    Candidate interface: fit_aftershock_model(history, training_cases, info) -> model; model.forecast(history, case) -> float array (17,) of probabilities (each >= 1e-9, summing to 1 within 1e-6) that the number of target earthquakes falls in the bins [0], [1], ..., [9], [10-14], [15-19], [20-29], [30-49], [50-99], [100-199], [200 or more] (info['bin_edges'] = 0, 1, ..., 10, 15, 20, 30, 50, 100, 200). history is a dict of numpy arrays t (days since 1980-01-01 00:00 UTC), lat, lon, depth (km) and mag of all ComCat earthquakes with magnitude >= 5 worldwide, sorted by time. A case is a dict of floats main_t, main_lat, main_lon, main_depth, main_mag (a shallow, depth <= 70 km, magnitude >= 6 mainshock that is not within the zone of an equal or larger event of the previous 365 days), start (main_t + 1 or main_t + 7 days), window_days (7 or 30) and radius_km = max(50, 2 * 10^(0.5 main_mag - 1.8)); the target is the number of magnitude >= 5 events at any depth within radius_km of the mainshock epicentre during [start, start + window_days). training_cases holds the same fields plus the observed count for the 4207 cases with start before 2015-01-01, and the fit-time history holds the events before 2015-01-01. Forecasts are then requested in order of start for the 1443 cases starting from 2015-01-01 to 2024-11-22; history then holds every event before the case's start and nothing later. The candidate runs in a separate sandboxed process (numpy, scipy, scikit-learn and pandas importable; no file, network or subprocess access; one thread) with 240 s of CPU time for fitting and all predictions together; seed any randomness so that results are deterministic. Score: mean natural-log probability assigned to the observed bins; higher is better. Wrong shapes, NaN, probabilities below 1e-9 or not summing to 1 are invalid

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
