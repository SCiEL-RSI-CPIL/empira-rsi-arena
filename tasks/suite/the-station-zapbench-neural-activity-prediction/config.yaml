# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 900
  max_retries: 2

prompt:
  system_message: |
    ZAPBench neural activity prediction

    Write the Station's JAX/Flax hooks (network, loss, optimizer, hyperparameters, batch size) for forecasting 32 steps of 71,721 zebrafish neurons from 4 context steps; the evaluator trains on ZAPBench's training split for at most 3 CPU epochs or 600 s (seed 42), keeps the best-validation parameters and scores the test MAE averaged over 9 test conditions (lower is better).

    Candidate interface: The Station's ZAPBench hooks, each optional (an omitted hook falls back to the Station's default: shared-neuron MLP, mean-absolute-error loss, Adam with learning rate 0.001, batch size 8): create_network(hparams) -> an object with init(rng_key, dummy_input) -> parameter pytree (dummy_input is float32 [1, 4, 71721]) and apply(params, x, training=False, mutable=None, rngs=None) -> float predictions [batch, 32, 71721] for x float32 [batch, 4, 71721]; optional attributes mutable (list of mutable Flax collections such as ['batch_stats']; apply then returns (predictions, updates) when called with mutable) and needs_rng (True to receive rngs={'dropout': key} in training); compute_loss(predictions, targets, params, x) -> scalar training loss; create_optimizer(learning_rate) -> optax.GradientTransformation (applied to params['params'] for Flax-style parameters, as in the Station); _define_hyperparameters() -> dict of plain JSON values (learning_rate is passed to create_optimizer); BATCH_SIZE int in 1..64. Data: ZAPBench 240930_traces (calcium activity of 71,721 neurons of a larval zebrafish, values about -0.25..1.5) with ZAPBench's condition-aware splits for a 4-step context: training windows (4 context + 32 target steps, stride 1, never crossing a condition) from the first 70 % of the 8 training conditions (4,772 windows), validation windows from the next 10 % (469 windows). Training: the Station's loop with one fixed seed (42; the candidate's BASE_SEED is ignored): shuffled epochs, the Station's train step, validation MAE after every epoch, early stopping with patience 20 and the best-validation parameters kept; reduced CPU budget of at most 3 epochs and 600 s of training wall time with 4 threads (training stops before an epoch that is predicted to exceed the cap); this budget and the seed bind the Station's loop, while the candidate's own code runs in the same child process with the training and validation arrays and is limited only by that process's 720 s wall-clock, CPU-time and 6,000 MB memory limits. Predictions are made one window at a time (apply on a single window with training=False, vmapped), exported with jax.export (host callbacks and foreign custom calls are rejected) and run on the test split by a separate process that never executes candidate code. Score (minimize): ZAPBench test MAE = mean over the 9 test conditions (the last 20 % of each training condition plus the held-out taxis condition, condition 3, from 252 steps after its start, as in ZAPBench's test_holdout split for a 4-step context) of the mean absolute error over all stride-1 test windows (1,557 in all), the 32 predicted steps and the 71,721 neurons

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
