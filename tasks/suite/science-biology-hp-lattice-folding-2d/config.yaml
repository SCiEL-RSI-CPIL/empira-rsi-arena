# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 180
  max_retries: 2

prompt:
  system_message: |
    Biology: HP lattice protein folding on the square lattice

    Fold the ten standard two-dimensional HP benchmark sequences (20 to 100 residues) into low-energy self-avoiding conformations on the square lattice. The evaluator checks self-avoidance, recomputes the hydrophobic contact energy of every conformation and scores the mean ratio to the lowest energies reported in the literature.

    Candidate interface: fold(sequence, dimension) -> list of len(sequence) integer lattice points (lists of length dimension). sequence is a string of H and P residues; dimension is 2 (square lattice). The returned walk must be self-avoiding with unit steps between consecutive residues. Energy = minus the number of H-H pairs on neighbouring lattice sites that are not adjacent along the chain; the evaluator recomputes it. fold is called once per benchmark sequence in a sandboxed subprocess with a 120 s CPU budget for all sequences together. Score (maximize): mean over the 10 benchmark sequences of energy / best_known_energy (both energies are negative), so 0 is an unfolded chain, 1.0 reproduces every best-known energy and a value above 1.0 beats one

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
