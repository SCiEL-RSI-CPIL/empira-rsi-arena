# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 240
  max_retries: 2

prompt:
  system_message: |
    Earth science: monthly Mauna Loa CO2 forecasts

    Fit a forecast model of atmospheric CO2 on the Mauna Loa monthly record up to 1999, together with an ENSO index, and for every month from 2000 to 2024 forecast the next 12 monthly means using only data up to that month. The score is the mean root-mean-square error over the 12 lead times.

    Candidate interface: fit_co2_model(training) -> model; model.forecast(history) -> float array (12,) of monthly mean atmospheric CO2 at Mauna Loa (ppm, NOAA GML/SIO record) for each of the 12 months after the last month in history. training and history are dicts of numpy arrays over consecutive months from 1958-03: year, month, co2_ppm, measured_days (number of measurement days; -1 for interpolated months and for the 1958-1974 Scripps values) and relative_nino34 (ERSSTv5 Nino 3.4 anomaly minus the 20S-20N mean SST anomaly, from 1951-1980 monthly climatologies). training ends in 1999-12. Forecasts are then requested in order for every origin month from 2000-01 to 2024-12; history holds all months up to and including the origin month and nothing later. The candidate runs in a separate sandboxed process (numpy, scipy, scikit-learn and pandas importable; no file, network or subprocess access; one thread) with 120 s of CPU time for fitting and all predictions together; seed any randomness so that results are deterministic. Score: mean over leads 1-12 of the root-mean-square error (ppm) over the 300 origins, using only measured (not interpolated) verifying months; lower is better. Wrong shapes, NaN or values outside [250, 600] ppm are invalid

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
