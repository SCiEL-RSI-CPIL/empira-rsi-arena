# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Covering design C(24,7,3)

    Choose as few 7-element blocks of 24 points as possible so that every 3-element subset lies in some block. The best known covering has 76 blocks (La Jolla Covering Repository) and the repository's lower bound is 69, so the covering number C(24,7,3) is open.

    Candidate interface: construct(v, k, t) -> list of blocks; the evaluator passes this task's parameters v, k and t. Each block is a list of k distinct integers in 0..v-1 (a k-subset of the v points) and blocks must be distinct; at most C(v, t) blocks. Valid when every t-subset of {0, ..., v-1} lies in at least one block (checked exhaustively). Score: the number of blocks, minimized; it is an upper bound on the covering number C(v, k, t).

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
