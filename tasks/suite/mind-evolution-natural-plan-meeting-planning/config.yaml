# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 900
  max_retries: 2

prompt:
  system_message: |
    Natural Plan Meeting Planning

    Write a solve(question, llm) program that uses a budgeted OpenRouter LLM client to answer Natural Plan meeting-planning prompts (meet as many San Francisco friends as possible under availability and travel-time constraints); scored by success rate on a fixed 30-problem test sample, a plan succeeding when its simulated valid meetings match the golden plan's count (higher is better).

    Candidate interface: solve(question: str, llm) -> str. `question` is Natural Plan's 5-shot Meeting Planning prompt (meet as many friends as possible in San Francisco under availability, location and travel-time constraints; answer starting with 'SOLUTION:' in the shown step format). `llm(...)` is a budgeted, cached OpenRouter chat client. Plan checker (port of Natural Plan's evaluate_meeting_planning.py): the text after 'SOLUTION:' is split on periods and simulated step by step ('You start/travel/wait/meet ...'); the count of valid meetings before the first invalid step must equal that of the golden plan. Score: success rate on a fixed 30-problem sample of Mind Evolution's 500-problem test split; higher is better

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
