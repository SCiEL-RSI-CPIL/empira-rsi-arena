# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 900
  max_retries: 2

prompt:
  system_message: |
    FiNER

    FiNER task evaluated in Meta Context Engineering via Agentic Skill Evolution.

    Candidate interface: solve(question: str, llm) -> str. `llm(prompt_or_messages, system=None, max_tokens=None, temperature=None, json_mode=False) -> str` is a budgeted, cached OpenRouter chat client. `question` is MCE's 139-tag US GAAP context, the question 'What is best tag for entity ... in sentence ...' and a request for one tag name. Answer rule (MCE's FiNER check): the first comma-separated element of the final answer (the text after the last 'Answer:' marker, else the last \boxed{...}, else the last non-empty line), stripped of quotes and backticks, must equal the gold tag case-insensitively. Score: accuracy on a fixed 30-item sample of MCE's 100-item FiNER test split; higher is better

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
