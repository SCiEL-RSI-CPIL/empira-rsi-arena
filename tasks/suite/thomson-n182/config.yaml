# SCiEL / OpenEvolve configuration generated by scripts/build_new_tasks.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 300
  max_retries: 2

prompt:
  system_message: |
    Thomson problem, N = 182

    Place 182 equal point charges on the unit sphere in R^3 so that their Coulomb energy, the sum of 1/distance over all pairs of points, is as small as possible (the Thomson problem).

    Candidate interface: construct() -> array of shape (182, 3): one point per row (the verifier scales every row to unit length; a zero or non-finite row is invalid, and so are two points that coincide). Score: sum over all pairs of points of 1/(Euclidean distance), minimized.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
