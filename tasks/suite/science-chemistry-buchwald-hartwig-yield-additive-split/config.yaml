# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 900
  max_retries: 2

prompt:
  system_message: |
    Buchwald-Hartwig yield prediction for unseen additives

    Predict the yields of palladium-catalysed C-N couplings that use isoxazole additives never seen in training, on the four out-of-sample tests of Ahneman et al. The evaluator scores the mean coefficient of determination (R^2) over the four tests.

    Candidate interface: predict_yields(train_reactions, train_yields, test_reactions, info) -> list of len(test_reactions) predicted yields (percent). Buchwald-Hartwig couplings of Ahneman et al. (2018); reaction = {'aryl_halide', 'ligand', 'base', 'additive' (canonical SMILES), 'amine', 'catalyst', 'product', 'reaction_smiles' (rxn_yields format)}. The four out-of-sample tests Test1-Test4 (3057/3055/3058/3055 training and 898/900/897/900 test reactions) are called separately; test additives never occur in training. Each split is predicted in a fresh process that receives the training reactions with yields and the test reactions without yields; info = {'dataset', 'split', 'n_train', 'n_test', 'yield_unit': 'percent'}. Runs in a separate process that receives only these arguments (no test values), with at most 4 threads (OMP/MKL/OpenBLAS set to 4), no network, no subprocesses and no read access to the repository or prepared data; numpy, scipy, scikit-learn and RDKit are importable (pandas and torch only where the environment provides them; they are not requirements of the task); wall-clock limit 200 s per test. Score: mean coefficient of determination R^2 over the four tests (maximize)

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
