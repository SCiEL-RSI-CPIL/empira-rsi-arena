# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Physics: broadband antireflection coating design

    Design a stack of at most twenty low- and high-index layers (1.38 and 2.35) on glass that minimizes the mean reflectance between 400 and 800 nm at normal incidence, with at most 1000 nm of total coating. The evaluator checks the constraints and computes the reflectance spectrum exactly with the thin-film characteristic-matrix method.

    Candidate interface: design(problem) -> (materials, thicknesses): a list of 'L'/'H' labels and a list of physical thicknesses in nm, layers ordered from the air side to the substrate. problem gives ambient_index 1.0, substrate_index 1.52, materials {'L': 1.38, 'H': 2.35} (lossless, non-dispersive), band_nm [400, 800], max_layers 20, max_total_nm 1000 and max_layer_nm 400; every thickness must lie in [0, max_layer_nm] and the sum must not exceed max_total_nm. design runs in a sandboxed subprocess with a 60 s CPU budget. Score (minimize): mean normal-incidence reflectance in percent over 401 equally spaced wavelengths in the band, computed exactly with the characteristic-matrix method (bare glass: 4.26 %)

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
