# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 240
  max_retries: 2

prompt:
  system_message: |
    Physics: exact quantum circuit synthesis within published CNOT budgets

    Compile seven fixed two- and three-qubit unitaries (CNOT, iSWAP, SWAP, the Toffoli gate and three generic unitaries) into single-qubit rotations and CNOT gates without exceeding the CNOT counts known to suffice for each. The evaluator rebuilds every circuit's unitary exactly and scores the mean phase-insensitive distance to the targets.

    Candidate interface: synthesize(problem) -> list of gates. problem has keys name, qubits (2 or 3), cnot_budget and the target unitary as real and imaginary (nested lists of 2**qubits rows). A gate is ['u3', qubit, theta, phi, lam] for the standard single-qubit rotation or ['cx', control, target] for a CNOT; qubit 0 is the most significant bit of the basis index. At most cnot_budget CNOTs and 400 gates per circuit. synthesize is called once per target in a sandboxed subprocess with a 150 s CPU budget for all seven targets. Score (minimize): mean over the targets of the phase-insensitive distance 1 - |tr(target^dagger U)| / 2**qubits, where the evaluator rebuilds U from the gate list; 0 means exact synthesis of every target within its budget

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
