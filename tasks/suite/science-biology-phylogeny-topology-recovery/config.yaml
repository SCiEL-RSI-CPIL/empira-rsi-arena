# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 240
  max_retries: 2

prompt:
  system_message: |
    Biology: phylogenetic topology recovery from simulated sequences

    Reconstruct the unrooted tree topology of twenty simulated instances with 8 to 32 taxa and 250 to 2000 sites, generated inside the evaluator under the Jukes-Cantor model with hidden random topologies and branch lengths. The score is the mean normalized Robinson-Foulds distance to the generating trees.

    Candidate interface: reconstruct(sequences) -> Newick string over the labels t0..t(n-1) (branch lengths optional, trailing semicolon optional, every taxon exactly once). sequences maps those labels to equal-length DNA strings over ACGT simulated along an unknown tree. reconstruct is called once per instance in a sandboxed subprocess with a 180 s CPU budget for all 20 instances (8 to 32 taxa, 250 to 2000 sites). Score (minimize): mean normalized Robinson-Foulds distance between the non-trivial unrooted splits of the returned tree and those of the generating tree: the number of splits present in only one of the two trees divided by the total number of splits of both trees (for a binary answer this is RF / (2 (n - 3)); an unresolved star tree scores 1); 0 means recovering every topology exactly

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
