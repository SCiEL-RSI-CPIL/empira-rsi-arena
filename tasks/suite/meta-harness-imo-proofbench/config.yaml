# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 1800
  max_retries: 2

prompt:
  system_message: |
    IMO-ProofBench

    IMO-ProofBench task evaluated in Meta-Harness: End-to-End Optimization of Model Harnesses.

    Candidate interface: solve(question: str, llm) -> str: a complete proof for an IMO-ProofBench problem (`question` is the problem statement and a request for a rigorous proof). `llm(...)` is a budgeted, cached OpenRouter chat client. A judge model grades the proof against the reference solution and the problem's grading guidelines on IMO-Bench's 0/1/6/7-point scale (first <points>N out of 7</points> block of its reply; unparsable grades count as 0). Score: mean points / 7 over a fixed seeded sample of the 60 problems; higher is better

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
