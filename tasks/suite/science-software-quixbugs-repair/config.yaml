# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 480
  max_retries: 2

prompt:
  system_message: |
    Software engineering: test-based repair of the QuixBugs Python programs

    Write a general repair procedure that receives a buggy QuixBugs Python program with a few visible tests and returns a patch of at most two statements. A patch counts only when it also passes held-out QuixBugs tests and generated tests whose expected outputs come from the reference fix.

    Candidate interface: repair(task) -> str. task = {'name': str, 'entry': str, 'source': str, 'tests': [{'input': [arguments], 'expected': value, 'tolerance': float (only for sqrt)}, ...], 'max_statement_edits': 2}: 'source' is a buggy QuixBugs Python program defining the function 'entry'; 'tests' are its visible tests, at least one of which fails. Return the patched program as a str of at most 20000 characters that differs from 'source' in at most 2 statements (replaced, inserted or deleted statements of the parsed program; formatting and comments do not count). A test passes when entry(*input) returns the expected value after JSON normalisation (generators are consumed into lists, tuples become lists), or a number within 'tolerance' of it, within the test's step limit. A step is one function entry or one loop iteration of the program, counted by the evaluator, so the limit does not depend on the speed of the machine: 2,000,000 steps per test, and 25,000,000 for the test levenshtein('rosettacode', 'raisethysword'), on which the reference fix makes 10,308,990 calls (on every other test the reference fixes need at most 761,717 steps). A CPU-time limit of 10 s plus 2 microseconds per allowed step remains as a safety net for programs whose steps are individually slow. Score: fraction of the 31 programs whose patch passes its visible tests, its remaining QuixBugs tests and 10 to 40 generated held-out tests whose expected values come from the reference fix (higher is better); a patch passing only some of them counts as overfitting, not repaired. repair() runs once per program in a sandboxed subprocess (no files, network or subprocesses; 4 s CPU, 1 GB) and may execute the given program and tests itself; it should be deterministic. The procedure must be general: remembered program-specific fixes are outside the contract. A repair() call that raises, exceeds its limits or returns something other than a str of at most 20000 characters makes the whole evaluation invalid.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
