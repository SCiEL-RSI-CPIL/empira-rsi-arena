# SCiEL / OpenEvolve configuration generated by scripts/build_new_tasks.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 1200
  max_retries: 2

prompt:
  system_message: |
    Matbench v0.1 glass

    Predict whether an alloy forms a metallic glass (1) or not (0) from its composition (Matbench v0.1 task glass, 5680 samples). The evaluation uses the five official folds: for every fold the candidate is called once, in a separate process, with the other four folds and their target values as training data, and must predict the held-out fold within 200 seconds.

    Candidate interface: fit_predict(train_inputs, train_targets, test_inputs, info) -> list of len(test_inputs) numbers, each exactly 0 or 1 (class labels; any other value is invalid). Every input is a dict with the keys formula (a string) and composition (a dict from element symbol to amount). info has task, input_type, target, unit, fold, n_train and n_test. Score: mean over the five folds of the held-out ROC AUC of the 0/1 labels (which equals the balanced accuracy), maximized.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
