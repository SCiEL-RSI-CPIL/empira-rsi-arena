# SCiEL / OpenEvolve configuration generated by scripts/build_new_tasks.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 2400
  max_retries: 2

prompt:
  system_message: |
    EPFL max, LUT-6 levels

    Optimise the EPFL combinational benchmark circuit max (the maximum of four 128-bit numbers; 512 inputs, 130 outputs) with the logic-synthesis tool ABC and map it to lookup tables (LUTs) with at most 6 inputs, minimising the number of LUT levels, the largest number of LUTs on a path from an input to an output. The result must compute the same function as the original circuit.

    Candidate interface: script() -> string of ABC commands separated by `;` or newlines. The evaluator runs `read <circuit>; <script>` in ABC and writes out the network the script leaves. That network must consist only of LUTs with at most 6 inputs (in ABC a LUT mapper such as `if -K 6` produces one; library gates or a wider node are invalid), and it must be equivalent to the original circuit, which a separate ABC process checks with `cec`. The script may not contain the characters ! / \ ~, may not use commands that read or write files, change the session or start other programs (read*, write*, load*, dump*, save* and their short forms, source, alias, set, unset, history, cd, ls, pwd, quit, exit), and may not ask for LUTs wider than 6 inputs (-K above 6). Time limits: 1200 s for the script, 900 s for the equivalence check. A script that is refused, fails, runs out of time or changes the function is invalid. Score: the largest number of LUTs with two or more inputs on a path from an input to an output (buffers, inverters and constants are not counted), minimized.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
