# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Physics: product-formula design for Heisenberg-chain time evolution

    Choose the coefficients of a twelve-stage product formula that approximates the time evolution of a six-site Heisenberg chain split into even and odd bonds. The evaluator builds every factor and the exact propagator and scores the mean spectral-norm error at three evolution times.

    Candidate interface: coefficients(stages) -> (a, b), two lists of 12 finite numbers in [-50, 50] with sum(a) = sum(b) = 1 (consistency). The evaluator forms the product formula U(t) = prod_k exp(-i b_k t B) exp(-i a_k t A) in order k = 1..12, where A and B are the odd- and even-bond halves (each including half of the uniform field) of a six-site open XXZ Heisenberg chain with anisotropy 0.8 and field 0.3. Score (minimize): mean over t = 0.25, 0.5 and 1.0 of the spectral norm ||U(t) - exp(-i t (A + B))||. coefficients runs in a sandboxed subprocess with a 60 s CPU budget

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
