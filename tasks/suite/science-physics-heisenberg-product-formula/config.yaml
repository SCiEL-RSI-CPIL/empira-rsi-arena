# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Physics: product-formula design for Heisenberg-chain time evolution

    Choose the coefficients of a twelve-stage product formula that approximates the time evolution of a six-site Heisenberg chain split into even and odd bonds. The evaluator builds every factor and the exact propagator and scores the mean spectral-norm error at three evolution times.

    Candidate interface: coefficients(stages) -> (a, b), two lists of 12 finite numbers in [-50, 50] with sum(a) = sum(b) = 1 (consistency). The evaluator forms the product formula U(t) = S_12 ... S_2 S_1 with S_k = exp(-i b_k t B) exp(-i a_k t A): stage 1 acts first, and within a stage the A factor acts before the B factor. With sites numbered 0..5 and Pauli matrices X, Y, Z, the Hamiltonian of the six-site open XXZ chain (anisotropy 0.8, field 0.3) is H = sum_{j=0..4} (X_j X_{j+1} + Y_j Y_{j+1} + 0.8 Z_j Z_{j+1}) + 0.3 sum_{j=0..5} Z_j = A + B, where A holds the bonds (0,1), (2,3), (4,5) and the field on sites 0, 2, 4, and B holds the bonds (1,2), (3,4) and the field on sites 1, 3, 5. Score (minimize): mean over t = 0.25, 0.5 and 1.0 of the spectral norm ||U(t) - exp(-i t (A + B))||. coefficients runs in a sandboxed subprocess with a 60 s CPU budget

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
