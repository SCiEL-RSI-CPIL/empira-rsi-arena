# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 240
  max_retries: 2

prompt:
  system_message: |
    Biology: RNA secondary-structure prediction against Rfam consensus structures

    Predict the secondary structure of 90 non-coding RNA sequences from 47 Rfam families that have experimentally determined three-dimensional structures. The evaluator compares the predicted base pairs with the family's consensus pairing projected onto each sequence and scores the mean F1.

    Candidate interface: predict_structure(sequence) -> dot-bracket string of the same length as sequence, containing only '.', '(' and ')' with balanced brackets. sequence is an ACGU string of 40 to 150 nucleotides from an Rfam family that has a three-dimensional structure. predict_structure is called once per sequence in a sandboxed subprocess with a 180 s CPU budget for all 90 sequences. Score (maximize): mean F1 of the predicted base-pair set against the reference pairs, i.e. the harmonic mean of sensitivity and precision; sensitivity and precision are reported separately

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
