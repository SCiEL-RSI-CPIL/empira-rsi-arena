# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 300
  max_retries: 2

prompt:
  system_message: |
    Finance: Out-of-sample portfolio choice against 1/N (ten industries and the market)

    Choose each month's portfolio of ten US industry portfolios and the market using only the previous 120 months of returns. The evaluator recomputes the Sharpe ratio of the next-month returns net of 50 bp trading costs over 1973-07 to 2025-09 and compares it with the 1/N rule.

    Candidate interface: choose_weights(excess_returns, context) -> array of N finite positions x. excess_returns is a (120, N) float array of the previous 120 monthly excess returns (decimal, oldest first) of the task's N assets; context = {'cost_rate': 0.005, 'window': 120, 'max_gross': 20.0, 'risk_free': (120,) monthly T-bill returns, 'previous_weights': drifted relative weights just before rebalancing (None in the first month)}. The evaluator forms DeMiguel-Garlappi-Uppal relative weights w = x/|sum(x)| (sum(x) must be nonzero and sum|w| <= 20), holds w for the next month, charges 0.5% of sum|w - previous_weights| per rebalance and requires wealth to stay positive. Score: monthly Sharpe ratio of the net out-of-sample excess returns over every month of the task period (maximize); the 1/N rule is recomputed on the same months for comparison. The candidate runs in a separate sandboxed process: numpy, scipy, scikit-learn and the other installed packages are importable, while the evaluator's library, its data files, the network and subprocesses are not accessible; one thread and 3 GB of memory. It receives only the arguments described here, one call at a time: the arguments of a call are sent after the value of the previous call has been received. Arguments and return values travel as numbers, strings, lists, dicts with string keys and numeric numpy arrays, so a tuple arrives as a list

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
