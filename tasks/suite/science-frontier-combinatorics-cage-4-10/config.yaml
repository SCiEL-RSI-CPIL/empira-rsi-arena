# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Small 4-regular graph of girth 10 (cage problem n(4,10))

    Construct a 4-regular graph with no cycle shorter than 10 on as few vertices as possible. The smallest known such graph has 320 vertices (Exoo, Goedgebeur, Jooken, Stubbe and Van den Eede, 2026) and the best lower bound is 243.

    Candidate interface: construct(k, g) -> (n, edges): the number of vertices n and a list of edges (i, j) on vertices 0..n-1; the evaluator passes this task's degree k and girth g. The graph must be simple (no loops or repeated edges), every vertex must have degree exactly k, and no cycle may be shorter than g (certified exactly with non-backtracking walks from every vertex). n must lie between the Moore bound and max_vertices. Score: n, minimized; it is an upper bound on the cage order n(k, g).

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
