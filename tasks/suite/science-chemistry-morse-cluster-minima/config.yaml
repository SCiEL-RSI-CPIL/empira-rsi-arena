# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 300
  max_retries: 2

prompt:
  system_message: |
    Morse cluster global minima across the range of the potential

    Find the lowest-energy arrangements of 38 to 80 atoms bound by Morse potentials of long, medium and short range (six instances). Energies are recomputed exactly and compared with the putative global minima of Doye and Wales.

    Candidate interface: construct(instance) -> array of shape (n, 3): Cartesian coordinates of n atoms in reduced units (pair equilibrium distance 1). instance = {'potential': 'morse', 'rho': range parameter, 'n': atoms}; called once for each of six instances (rho, n) = (3, 80), (6, 38), (6, 75), (10, 38), (10, 50), (10, 80); all six calls together must finish within 300 s, using at most 4 threads. The evaluator recomputes E = sum_{i<j} exp(rho(1-r_ij))(exp(rho(1-r_ij)) - 2) (well depth 1); atoms must be at least 0.5 apart. Score: mean over instances of 100*(E - E_pub)/|E_pub| against the putative global minima tabulated by Doye and Wales (1997) (minimize; 0 matches all six, negative is lower than published). chem_clusters.relax(positions, 'morse', rho) and chem_clusters.morse_energy_gradient(positions, rho) may be called

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
