# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 600
  max_retries: 2

prompt:
  system_message: |
    Earth science: one-day earthquake forecasts for southern California

    Fit an earthquake occurrence model on the 1981-2015 southern California ComCat catalogue and, for every day of 2016-2024, forecast the expected number of magnitude 3.45 or larger earthquakes in each 0.1-degree cell using only events before that day. The score is the information gain per earthquake of the Poisson likelihood over a time-independent smoothed-seismicity reference.

    Candidate interface: fit_quake_model(training, grid) -> model; model.forecast(history, day) -> float array (50, 70) of the expected number of target earthquakes (magnitude >= 3.45, depth <= 30 km) during [day, day + 1) in each 0.1-degree cell: row i is latitude 32.0 + 0.1 i to 32.1 + 0.1 i deg N, column j is longitude -121.0 + 0.1 j to -120.9 + 0.1 j deg E (grid['lat_edges'] (51,), grid['lon_edges'] (71,)). training and history are dicts of numpy arrays t (days since 1981-01-01 00:00 UTC), lat, lon (deg), depth (km) and mag of all ComCat earthquakes with magnitude >= 2.5 in 31-38 N, 122-113 W, sorted by time; training holds the events before 2016-01-01. grid also gives target_min_magnitude 3.45, target_max_depth_km 30, first_forecast_day 12783 (2016-01-01) and last_forecast_day 16070 (2024-12-31). Forecasts are requested in order for every day from 2016-01-01 to 2024-12-31 (day is the float day number); history then holds every event before 00:00 UTC of that day and nothing later. The candidate runs in a separate sandboxed process (numpy, scipy, scikit-learn and pandas importable; no file, network or subprocess access; one thread) with 300 s of CPU time for fitting and all predictions together; seed any randomness so that results are deterministic. Score: information gain per target earthquake (nats) of the joint Poisson log-likelihood of the observed daily cell counts (1047 target events) over the evaluator's time-independent reference (1981-2015 epicentres smoothed with a 0.15-degree Gaussian kernel and scaled to the 1981-2015 target rate); higher is better. Rates below 1e-10, NaN, wrong shapes or daily totals above 1e4 are invalid

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
