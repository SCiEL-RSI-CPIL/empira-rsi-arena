# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 180
  max_retries: 2

prompt:
  system_message: |
    XLA auto-sharding IOPDDL

    XLA auto-sharding IOPDDL task evaluated in Magellan: Autonomous Discovery of Novel Compiler Optimization Heuristics with AlphaEvolve.

    Candidate interface: solve(problem, time_limit_s) -> list with one strategy index per node, or [] for no solution. problem is the contest's JSON 'problem' object: name; nodes = {intervals: [start, end) per node, costs: per-strategy node costs, usages: per-strategy memory usages}; edges = {nodes: [u, v] pairs, costs: row-major |S_u| x |S_v| resharding cost tables}; usage_limit. The usages of the nodes whose interval contains t must sum to at most usage_limit for every t; forbidden choices cost 1e18. Score (maximize): mean contest points over the benchmarks, points = best submitted contest cost / candidate total cost, 0 for an infeasible, empty or late answer (later than time_limit_s + grace_s wall-clock seconds); a wrong-length or out-of-range answer is invalid

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
