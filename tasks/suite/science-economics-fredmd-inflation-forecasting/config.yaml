# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 600
  max_retries: 2

prompt:
  system_message: |
    Economics: Forecasting US CPI inflation with FRED-MD

    Forecast annualized US CPI inflation 1, 6 and 12 months ahead from the 126-series FRED-MD panel available at each month-end origin from 1990 to 2023. The evaluator recomputes the targets and scores the root-mean-square error relative to a direct autoregressive benchmark with BIC lag selection.

    Candidate interface: forecast_target(history, horizons) -> array of 3 floats: forecasts of the task's target 1, 6 and 12 months after the origin (horizons = [1, 6, 12]). Targets: for INDPRO and CPIAUCSL the annualized average growth 1200/h * ln(x_{t+h}/x_t) (percent per year); for UNRATE the change u_{t+h} - u_t (percentage points). history = {'yyyymm': (T,) ints, 'series': list of the 126 FRED-MD mnemonics, 'tcodes': (126,) McCracken-Ng transformation codes, 'panel': (T, 126) raw levels from 1959-01 through the origin month (NaN = missing), 'target': mnemonic, 'target_kind': 'growth' or 'difference'}. Called at the 404 month-end origins 1990-01..2023-08 of the 2024-09 vintage (pseudo-real-time); |forecast| <= 1000. Score: mean over horizons of RMSE(candidate) / RMSE(direct autoregression with BIC lag order 0-6 estimated from 1960), excluding forecasts whose target window includes 2020-03..2020-12 (minimize; the autoregressive seed scores exactly 1). The candidate runs in a separate sandboxed process: numpy, scipy, scikit-learn and the other installed packages are importable, while the evaluator's library, its data files, the network and subprocesses are not accessible; one thread and 3 GB of memory. It receives only the arguments described here, one call at a time: the arguments of a call are sent after the value of the previous call has been received. Arguments and return values travel as numbers, strings, lists, dicts with string keys and numeric numpy arrays, so a tuple arrives as a list

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
