# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 420
  max_retries: 2

prompt:
  system_message: |
    Software engineering: superoptimisation of the 25 Hacker's Delight kernels

    Rewrite each of 25 bit-manipulation kernels (Hacker's Delight, as used by Brahma and STOKE) into the shortest straight-line program over 32-bit operations that Z3 proves equal to the reference for every input. The score is the total instruction count; unproven programs count at the reference length.

    Candidate interface: optimize(problem) -> list of instructions. problem = {'name': str, 'description': str, 'inputs': [names], 'reference': [[dest, op, arg, ...], ...], 'operations': {op: arity}, 'max_instructions': 64}. An instruction [dest, op, args...] defines a new name; arguments are input names, earlier destinations or integer constants in [-2^31, 2^32 - 1] (taken modulo 2^32); the value of the last instruction is the result. All values are 32-bit words: add, sub, mul, and, or, xor, not, neg wrap modulo 2^32; shl, lshr and ashr take the full word as shift amount (32 or more gives 0, or the sign fill for ashr); udiv, urem, sdiv and srem follow SMT-LIB (x udiv 0 = 2^32 - 1, x urem 0 = x, x sdiv 0 = 1 for negative x and 2^32 - 1 otherwise, x srem 0 = x); eq, ne, ult, ule, ugt, uge, slt, sle, sgt, sge give 1 or 0; select(c, a, b) gives a if c != 0 else b. Score: total number of instructions over the 25 kernels, minimised; a kernel's program counts only if it agrees with the reference on 300 test inputs and Z3 proves it equal to the reference for every input within a fixed resource limit, otherwise the reference's length counts. A structurally invalid program (unknown operation, wrong arity, undefined or reused name, more than 64 instructions) makes the evaluation invalid. optimize() is called once per kernel, all kernels in one sandboxed subprocess (no files, network or subprocesses; 120 s CPU in total, 2 GB); it should be deterministic (seed any randomness, do not read clocks).

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
