# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 600
  max_retries: 2

prompt:
  system_message: |
    Finance: Cardinality-constrained mean-variance frontier (OR-Library)

    Build mean-variance portfolios of exactly ten assets, each held between 1% and 100%, at 51 fixed target returns for five OR-Library stock markets with 31 to 225 assets. The evaluator checks every constraint and scores Chang et al.'s mean percentage deviation from the published unconstrained efficient frontier.

    Candidate interface: build_frontier(problem) -> (51, N) float array: one portfolio per target return. problem = {'name': market, 'mean': (N,) expected weekly returns, 'cov': (N, N) covariance, 'K': 10, 'min_weight': 0.01, 'max_weight': 1.0, 'target_returns': (51,) evenly spaced from the return of the unconstrained minimum-variance portfolio to the highest return attainable with the constraints}. Every portfolio must hold exactly 10 assets (|w| <= 1e-12 counts as not held), each held weight in [0.01, 1], weights summing to 1 and expected return equal to its target (all within 1e-8). Called once for each OR-Library market: Hang Seng (N = 31), DAX 100 (85), FTSE 100 (89), S&P 100 (98), Nikkei 225 (225). Score: Chang et al.'s percentage error of each portfolio against the published unconstrained efficient frontier, min(100|s - s*(r)|/s*(r), 100|r - r*(s)|/r*(s)) by linear interpolation on the 2000 published frontier points (s = standard deviation, r = return), averaged over the 51 targets and then over the five markets (minimize). The candidate runs in a separate sandboxed process: numpy, scipy, scikit-learn, pandas and the other installed packages are importable, while the evaluator's library, its data files, the network and subprocesses are not accessible; one thread and 3 GB of memory. It receives only the arguments described here, one call at a time: the arguments of a call are sent after the value of the previous call has been received. Arguments and return values travel as numbers, strings, lists, dicts with string keys and numeric numpy arrays, so a tuple arrives as a list

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
