# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 600
  max_retries: 2

prompt:
  system_message: |
    Earth science: species distribution models from presence-only records

    Fit species distribution models for 226 anonymised species in six regions from presence-only records, background points and environmental covariates, and score sites of independent presence-absence surveys whose outcomes are withheld. The score is the mean area under the ROC curve over species.

    Candidate interface: predict_distributions(regions) -> dict {region: {species_id: float array (n_sites,)}} of habitat-suitability scores (any finite real numbers; only their ranking matters) at the presence-absence survey sites of each species' biological group. regions maps AWT, CAN, NSW, NZ, SA and SWI to dicts with covariates (list of k names), categorical (names of categorical covariates: CAN ontveg, NSW vegsys, NZ age and toxicats, SWI calc), coordinates (text naming the x/y system), presence {species_id: {'x': (n, k) covariate values, 'xy': (n, 2) coordinates}} of presence-only records, background {'x': (m, k), 'xy': (m, 2)} of random background points, and sites {group: {'x': (s, k), 'xy': (s, 2), 'species': [ids of the species evaluated at these sites]}}; NaN marks a missing covariate value. Presence-absence outcomes at the sites are never provided. The candidate runs in a separate sandboxed process (numpy, scipy, scikit-learn and pandas importable; no file, network or subprocess access; one thread) with 300 s of CPU time for fitting and all predictions together; seed any randomness so that results are deterministic. Score: mean over the 226 species of the area under the ROC curve (tied scores count one half) of the site scores against the observed presences and absences; higher is better. Missing species, wrong shapes or non-finite scores are invalid

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
