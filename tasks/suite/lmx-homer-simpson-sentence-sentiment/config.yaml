# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 600
  max_retries: 2

prompt:
  system_message: |
    Homer Simpson sentence sentiment

    Write a solve(question, llm) program that returns 1 to 300 one-line sentences rewriting the Homer Simpson quote 'Kids, you tried your best and you failed miserably. The lesson is, never try.' with positive sentiment; scored by QD score, the sum over 30 embedding-distance niches of the best positive probability from a RoBERTa sentiment classifier (higher is better).

    Candidate interface: solve(question: str, llm) -> list[str]: an archive of 1 to 300 one-line sentences of 5 to 400 characters, each valid Unicode text (no unpaired surrogates) and at most 512 tokens for the sentiment classifier's tokenizer (400 characters of CJK text or of some emoji are more). `question` is the target quote; `llm(...)` is an optional budgeted OpenRouter client (it needs OPENROUTER_API_KEY only when called). Each sentence's fitness is the 'positive' probability of cardiffnlp/twitter-roberta-base-sentiment-latest and its niche is the Euclidean distance between its all-MiniLM-L6-v2 embedding and the quote's, clipped to [0, 1.25] and cut into 30 equal bins. Score: QD score, the sum over occupied niches of the best fitness (at most 30); higher is better

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
