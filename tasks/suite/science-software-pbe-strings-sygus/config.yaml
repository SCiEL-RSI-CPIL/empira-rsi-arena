# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 300
  max_retries: 2

prompt:
  system_message: |
    Software engineering: programming by example for string transformations (SyGuS-Comp PBE strings)

    Write a synthesiser that, from a few input-output examples and a grammar, returns a string-manipulation program (phone numbers, names, initials, university addresses) that also reproduces held-out examples of the same task. The score is the fraction of 27 SyGuS-Comp tasks solved.

    Candidate interface: synthesize(task) -> str. task = {'name': str, 'function': str, 'params': [[name, sort], ...], 'sort': 'String', 'start': nonterminal, 'grammar': [[nonterminal, sort, [productions]], ...], 'examples': [[[argument strings], output string], ...]} is a SyGuS PBE string problem: productions are parameter names, literals (string literals as {'str': value}, integers, true, false), other nonterminals or operator lists such as ['str.substr', 'ntString', 'ntInt', 'ntInt']. Return one SMT-LIB term (an S-expression string; string literals in double quotes with "" for a quote, negative numbers as -1 or (- 1)) that the grammar derives from 'start'. Operations follow SMT-LIB 2.6 string semantics (str.++, str.len, str.at, str.substr, str.indexof, str.replace, str.to.int, int.to.str, str.prefixof, str.suffixof, str.contains, +, -, =, ite, with the edge cases of the standard, e.g. out-of-range str.at and str.substr give "" and str.to.int of a non-numeral gives -1). A task is solved when the term reproduces the given examples and the held-out examples of the benchmark's '-long' variant. Score: fraction of the 27 tasks solved, maximised; a term that does not parse or leaves the grammar counts as unsolved, a non-str answer makes the evaluation invalid. synthesize() is called once per task, all tasks in one sandboxed subprocess (no files, network or subprocesses; 120 s CPU in total, 2 GB); it should be deterministic (seed any randomness, do not read clocks).

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
