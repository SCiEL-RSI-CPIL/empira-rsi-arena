# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 300
  max_retries: 2

prompt:
  system_message: |
    Finance: Covariance estimation for minimum-variance portfolios

    Estimate the covariance matrix of 49 US industry portfolios from the previous 126 daily returns so that the implied global minimum-variance portfolio has the lowest realized out-of-sample volatility. The evaluator forms the portfolio from each estimate every 21 trading days from 1971 to 2025 and scores the annualized standard deviation of its daily returns.

    Candidate interface: estimate_covariance(returns) -> (49, 49) symmetric positive-definite float array. returns is a (126, 49) float array of the previous 126 daily returns (decimal, oldest first) of the 49 Fama-French industry portfolios. Called every 21 trading days from 1971-09 to 2025-09 (649 times); the evaluator forms the global minimum-variance weights w = S^-1 1 / (1' S^-1 1) from the estimate, holds them for the next 21 days and scores the annualized standard deviation (percent) of the 13,629 daily out-of-sample portfolio returns (minimize). The estimate must be finite, symmetric (1e-10 relative) and positive definite with condition number below 1e12

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
