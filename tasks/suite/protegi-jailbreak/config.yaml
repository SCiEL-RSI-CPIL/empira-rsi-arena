# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 900
  max_retries: 2

prompt:
  system_message: |
    Jailbreak detection

    Write a classifier that decides whether a single English user message is a jailbreak attempt, scored with binary F1 on a fixed sample of the public jackhhao/jailbreak-classification data; a clearly labelled proxy of ProTeGi's unreleased multilingual jailbreak-detection set.

    Candidate interface: solve(question: str, llm) -> str. `llm(prompt_or_messages, system=None, max_tokens=None, temperature=None, json_mode=False) -> str` is a budgeted, cached OpenRouter chat client. `question` is a user message followed by the question whether it is a jailbreak attack (answer Yes or No). Prediction rule (ProTeGi's binary predictor): the message is predicted to be a jailbreak exactly when the final answer (the text after the last 'Answer:' marker, else the last \boxed{...}, else the last non-empty line) starts with 'yes', case-insensitively; a crashing call predicts 'not a jailbreak'. Score: binary F1 of the jailbreak class over a fixed 40-message sample of the public jackhhao/jailbreak-classification test split (accuracy is reported as per_item_accuracy); higher is better

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
