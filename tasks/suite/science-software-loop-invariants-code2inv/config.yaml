# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 600
  max_retries: 2

prompt:
  system_message: |
    Software engineering: loop-invariant inference for the Code2Inv programs

    Infer a loop invariant for each of the 124 valid Code2Inv C programs so that Z3 proves initiation, consecution and the post-condition. The procedure may query a verifier that returns counterexamples (50 queries per program); the score is the fraction of programs with a proven invariant.

    Candidate interface: synthesize(problem, oracle) -> str. problem = {'name': str, 'c_source': str (declarations, pre-condition assignments, one while loop and a post-condition assert), 'variables': [names of the integer program variables], 'definitions': str (the Code2Inv SMT-LIB definitions of pre-f, trans-f and post-f over the variables, their primed next-state copies and SSA auxiliaries), 'max_queries': 50}. Return a loop invariant as one SMT-LIB Boolean term over the variables using integer literals (write negative numbers as (- n)), true, false and the operators and, or, not, =>, ite, =, <, <=, >, >=, +, -, * (at most one non-constant factor), div and mod (positive literal divisor), i.e. linear integer arithmetic. It is correct when Z3 proves initiation (pre-f implies it), consecution (it and trans-f imply it for the primed variables) and safety (it implies post-f), each within a fixed resource limit. oracle(invariant) performs the same check and returns {'valid': bool, 'failed': 'initiation', 'consecution', 'safety', 'syntax' or a budget message, 'state': a counterexample assignment of the variables or None, 'next': the successor assignment for consecution failures or None, 'queries_left': int, 'error': parse error if any}; each problem allows 50 queries and all queries share a fixed Z3 resource budget. Score: fraction of the 124 valid programs whose returned invariant is correct, maximised; a returned str that does not parse counts as not proven, a non-str answer makes the evaluation invalid. synthesize() is called once per program, all programs in one sandboxed subprocess (no files, network or subprocesses, so Z3 is not available there; 180 s CPU in total, 2 GB); it should be deterministic (seed any randomness, do not read clocks).

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
