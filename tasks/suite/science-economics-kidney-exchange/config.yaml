# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 600
  max_retries: 2

prompt:
  system_message: |
    Economics: Kidney exchange clearing with two- and three-way cycles

    Choose vertex-disjoint two- and three-way exchange cycles in eight public kidney-exchange pools of 256 and 512 incompatible patient-donor pairs to maximize the number of transplants. The evaluator verifies every donor-patient compatibility on the chosen cycles and compares the transplant count with the proven optimum.

    Candidate interface: select_exchanges(pool) -> list of cycles; each cycle is a list of 2 or 3 distinct pair indices [v1, ..., vk] such that the donor of v1 is compatible with the patient of v2, ..., and the donor of vk with the patient of v1, and no pair appears in two cycles. pool = {'name': str, 'pairs': n (256 or 512), 'edges': (E, 2) int array of compatible (donor_pair, patient_pair), 0-based, 'max_cycle_length': 3, 'time_limit_seconds': 60.0 (advisory)}. Called once for each of eight PrefLib kidney pools (00036-00000151..154 with 256 pairs, 00036-00000191..194 with 512 pairs, no altruists). Score: total transplants (pairs on the chosen cycles) divided by the total proven optimum, 1945 (maximize; 1 is optimal). The whole evaluation must finish within 600 s. The candidate runs in a separate sandboxed process: numpy, scipy, scikit-learn and the other installed packages are importable, while the evaluator's library, its data files, the network and subprocesses are not accessible; one thread and 3 GB of memory. It receives only the arguments described here, one call at a time: the arguments of a call are sent after the value of the previous call has been received. Arguments and return values travel as numbers, strings, lists, dicts with string keys and numeric numpy arrays, so a tuple arrives as a list

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
