# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 300
  max_retries: 2

prompt:
  system_message: |
    Finance: Optimal market making with inventory risk

    Set bid and ask quotes around the mid price in the Avellaneda-Stoikov limit-order-book model to earn the spread while controlling inventory risk, in three simulated market regimes. The evaluator simulates fills on fixed random numbers and scores the risk-adjusted profit relative to the exact optimal quoting policy.

    Candidate interface: quote(t, inventory, mid, params) -> (bid_depths, ask_depths): two float arrays of shape (4000,), one entry per simulated path, the distances below and above the mid price at which to quote in this step (np.inf = no quote; values >= -3/k). Called at every step n = 0..999 of each regime with t = n*dt, inventory (4000,) ints in [-Q, Q], mid (4000,) prices and params = {'sigma', 'A', 'k', 'gamma', 'T', 'steps', 'Q'}. Model: the bid is hit with probability 1 - exp(-A exp(-k bid_depth) dt) and the ask lifted likewise, independently; each fill earns its depth and moves inventory by one unit within |q| <= Q = 30 (quotes that would breach the bound are ignored); the mid moves by sigma*sqrt(dt)*N(0,1). Objective per path: spread captured minus (gamma/2)*sigma^2*sum(q^2 dt). Score: mean over three regimes (Avellaneda-Stoikov's example sigma 2, A 140, k 1.5, T 1 with gamma 0.05 and 0.5, and a thinner market) of the mean objective divided by that of the exact optimal policy of this discrete model on the same random numbers (maximize; about 1 at the optimum)

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
