# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 900
  max_retries: 2

prompt:
  system_message: |
    ArXivMath

    ArXivMath task evaluated in Meta-Harness: End-to-End Optimization of Model Harnesses.

    Candidate interface: solve(question: str, llm) -> str. `llm(prompt_or_messages, system=None, max_tokens=None, temperature=None, json_mode=False) -> str` is a budgeted, cached OpenRouter chat client. `question` is an ArXivMath problem followed by 'Put your final answer within \boxed{}.' Answer rule: the content of the reply's last \boxed{...} (else the final answer text after the last 'Answer:' marker or the last line) is parsed as LaTeX and must be equivalent to the gold answer under Math-Verify 0.9.0 (symbolic and numeric equivalence; ordered tuples must match in order). Score: accuracy over all 40 ArXivMath December 2025 and January 2026 problems; higher is better

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
