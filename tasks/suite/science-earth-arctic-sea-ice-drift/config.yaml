# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 480
  max_retries: 2

prompt:
  system_message: |
    Earth science: daily Arctic sea-ice drift from geostrophic winds

    Learn how Arctic sea ice drifts in response to the wind from 2000-2014 drifting-buoy tracks and reanalysis sea-level pressure, then predict the daily velocity of every buoy north of 70 N for each day of 2015-2024 from that day's geostrophic wind and the past buoy record. The score is the root-mean-square vector error of the predicted velocities.

    Candidate interface: fit_drift_model(training) -> model; model.forecast(history, today) -> float array (n, 2) of the eastward and northward ice velocity (cm/s) of each buoy listed in today over that day (displacement from 00 UTC to 00 UTC of the next day). training and history are dicts of numpy arrays, one row per buoy-day, with day (days since 2000-01-01), buoy (id), lat and lon (00 UTC position, deg; buoys at 70-90 N from the IABP product C), slp_hpa, ug and vg (geostrophic wind, m/s east and north, from a weighted plane fit to NCEP/NCAR daily-mean sea-level pressure within 500 km, air density 1.3) and u, v (the observed velocity, cm/s); training covers 2000-2014. Forecasts are requested in order for every day of 2015-2024 with active buoys; today holds day, buoy, lat, lon, slp_hpa, ug and vg of that day's buoys (the geostrophic wind is the daily mean over the forecast day); history holds all rows of earlier days, including the previous day's velocities, and nothing later. The candidate runs in a separate sandboxed process (numpy, scipy, scikit-learn and pandas importable; no file, network or subprocess access; one thread) with 240 s of CPU time for fitting and all predictions together; seed any randomness so that results are deterministic. Score: root-mean-square vector error sqrt(mean((u - u_obs)^2 + (v - v_obs)^2)) in cm/s over all 356683 buoy-days; lower is better. Wrong shapes, NaN or values outside [-200, 200] cm/s are invalid

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
