# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 900
  max_retries: 2

prompt:
  system_message: |
    Suzuki-Miyaura yield prediction on random splits

    Predict the yields of 5760 Suzuki-Miyaura couplings screened by Perera et al. across electrophiles, nucleophiles, ligands, bases and solvents, on ten random 70/30 splits. The evaluator scores the mean coefficient of determination (R^2) over the splits.

    Candidate interface: predict_yields(train_reactions, train_yields, test_reactions, info) -> list of len(test_reactions) predicted yields (percent). Suzuki-Miyaura couplings of Perera et al. (2018); reaction = {'reaction_smiles': 'reactants.reagents>>product'}. Ten random 70/30 splits of rxn_yields (4032 training, 1728 test reactions) are called separately. Each split is predicted in a fresh process that receives the training reactions with yields and the test reactions without yields; info = {'dataset', 'split', 'n_train', 'n_test', 'yield_unit': 'percent'}. Runs in a separate process that receives only these arguments (no test values), with at most 4 threads (OMP/MKL/OpenBLAS set to 4), no network, no subprocesses and no read access to the repository or prepared data; numpy, scipy, scikit-learn and RDKit are importable (pandas and torch only where the environment provides them; they are not requirements of the task); wall-clock limit 80 s per split. Score: mean R^2 over the ten splits (maximize)

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
