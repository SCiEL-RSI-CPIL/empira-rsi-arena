# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Sodarace walker program evolution

    Write a Python make_walker() that builds a valid Sodarace walker (point masses and oscillating springs) with the evaluator's walker_creator; scored by the absolute horizontal displacement of its centre of mass after 28 s of simulated time on flat ground in the vendored OpenELM Box2D simulator (higher is better).

    Candidate interface: make_walker() -> the Walker returned by wc.get_walker(), built with ELM's walker_creator interface: wc = walker_creator(); j = wc.add_joint(x, y) adds a point mass and returns its position (scaled by 0.22, y flipped); wc.add_muscle(j0, j1, amplitude=0.0, phase=0.0) adds a spring between two joints returned by add_joint. walker_creator and Walker are predefined by the evaluator (do not import them; candidate definitions are replaced). make_walker() runs once in a sandboxed process (30 s CPU, no file or network access). Validity: OpenELM's rules (amplitude at most 10, at most 10 springs per joint, joints at least 0.003 apart after scaling) plus at most 100 joints and 500 springs, all joints within a 30 x 30 box of scaled units, |phase| at most 1000 and finite numbers. The walker is dropped onto flat ground in the vendored OpenELM/iesor-physics Box2D simulator and run for 80 calls of update_world(350), i.e. 1,680 steps of 1/60 s (28 s); a spring with amplitude a >= -0.6 oscillates between its joints with length L0 + 0.15 (a + 1) cos(3 t + 2 pi phase) (t in simulated seconds, lengths in simulator units; one scaled unit is about 31 simulator units), a spring with a < -0.6 is rigid. Score: absolute horizontal displacement of the walker's centre of mass in simulator units (maximize)

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
