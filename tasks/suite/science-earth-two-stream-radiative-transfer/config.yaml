# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 150
  max_retries: 2

prompt:
  system_message: |
    Earth science: two-stream closures for solar radiative transfer

    Design the coefficients of a two-stream approximation for sunlight in a scattering and absorbing atmospheric layer as functions of single-scattering albedo, asymmetry parameter and solar zenith angle. The evaluator solves the two-stream equations for 12000 layers and scores the mean reflectance and transmittance error against an accurate 96-stream discrete-ordinate solution.

    Candidate interface: two_stream_coefficients(omega, g, mu0) -> (gamma1, gamma2, gamma3, f): four float arrays (n,) for n layers given by float arrays omega (single-scattering albedo, 0.5 to 1, exactly 1 for conservative layers), g (Henyey-Greenstein asymmetry parameter, 0 to 0.95) and mu0 (cosine of the solar zenith angle, 0.05 to 1). For each layer the evaluator delta-scales with the forward fraction f (tau' = (1 - omega f) tau, omega' = omega (1 - f) / (1 - omega f)) and solves exactly the two-stream equations dFup/dtau' = gamma1 Fup - gamma2 Fdown - gamma3 omega' exp(-tau'/mu0) and dFdown/dtau' = gamma2 Fup - gamma1 Fdown + (1 - gamma3) omega' exp(-tau'/mu0) (Meador and Weaver 1980; unit beam irradiance, no diffuse light entering at the top, black surface; omega' is capped at 1 - 1e-10) for the layer's optical depth tau, on which the coefficients cannot depend. The candidate runs in a separate sandboxed process (numpy, scipy, scikit-learn and pandas importable; no file, network or subprocess access; one thread) with 60 s of CPU time for fitting and all predictions together; seed any randomness so that results are deterministic. Score: mean over 12000 fixed random layers (tau log-uniform in 0.01-100, a quarter conservative) of |R - R_ref| + |T - T_ref|, where R is the reflectance, T the total (direct plus diffuse) transmittance and the references come from a 96-stream delta-M discrete-ordinate solution; lower is better. Coefficients must satisfy gamma1 > 0, gamma1 >= |gamma2|, 0 <= gamma3 <= 1 and 0 <= f < 1; NaN or wrong shapes are invalid

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
