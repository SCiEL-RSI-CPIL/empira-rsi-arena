# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 240
  max_retries: 2

prompt:
  system_message: |
    Earth science: homogenisation of monthly temperature networks

    Remove non-climatic breaks, drifts and outliers from 40 synthetic networks of ten correlated 100-year monthly temperature records, as climate-data centres do before estimating trends. The score is the mean centred root-mean-square difference between the homogenised and the true annual means, which the generator knows exactly.

    Candidate interface: homogenize(networks, calendar) -> list of 40 float arrays (10, 1200): homogenised monthly temperatures (deg C) of each network's stations. networks is a list of 40 arrays (10 stations, 1200 months) of observed monthly mean temperatures (deg C, NaN where missing) of 100-year synthetic networks; calendar holds year (1901-2000) and month (1-12) arrays (1200,). The observations contain non-climatic breaks (about five per century per station, sizes of standard deviation 0.8 deg C with a seasonal cycle; the most recent segment is unbiased), occasional network-wide clustered breaks, gradual drifts, outliers (1 percent, 3-5 deg C) and gaps (late starts, 2 percent random). Returned values at missing months are ignored. The candidate runs in a separate sandboxed process (numpy, scipy, scikit-learn and pandas importable; no file, network or subprocess access; one thread) with 120 s of CPU time for fitting and all predictions together; seed any randomness so that results are deterministic. Score: mean over the 400 stations of the centred root-mean-square difference between homogenised and true annual means (years with at least 10 observed months, computed over the observed months); lower is better. A wrong list length or array shape, or non-finite or implausible (|value| >= 100) values at observed months are invalid

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
