# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 300
  max_retries: 2

prompt:
  system_message: |
    Software engineering: coverage-guided fuzzing of CPython's html.parser

    Generate at most 1,000 input strings that drive html.parser.HTMLParser with _markupbase (CPython 3.12.14) through as many code blocks as possible. The score is the number of distinct instrumented blocks (function entries, branch outcomes, loop exits, handlers) that the inputs reach.

    Candidate interface: fuzz(target) -> list of str. target = {'subject': str, 'entry': str (how one input is executed), 'files': {path: source} (the subject's CPython 3.12.14 files as the evaluator loads them), 'instrumented': [paths whose coverage counts], 'max_inputs': 1000, 'max_chars': 2000}. Return at most max_inputs strings of at most max_chars characters. The evaluator imports the files under a private package name, inserts a numbered probe at the start of every block inside the functions of the instrumented files (function entry; if and else branches, including an empty else; loop bodies and normal loop exits; try bodies, else and finally blocks; exception handlers; with bodies; match cases; both branches of conditional expressions), runs the entry on every input (exceptions are expected and ignored; 0.5 s of CPU time per input) and counts the distinct probes reached. Entries: tomllib -> tomllib.loads(text); re -> re._compiler.compile(text, 0), i.e. regular-expression parsing and compilation; html.parser -> for convert_charrefs in (True, False): HTMLParser(convert_charrefs).feed(text) then close(); plistlib -> plistlib.loads(text.encode('latin-1')), so each character U+0000-U+00FF is one byte and the XML or binary format is detected from the bytes (characters above U+00FF only raise the encoding error). Score: number of distinct probes reached, maximised; replaying all inputs may take at most 120 s of CPU time, otherwise the evaluation is invalid. fuzz() runs in a sandboxed subprocess (no files, network or subprocesses; 60 s CPU, 2 GB) and may load and run the given files itself, for example to trace coverage; it should be deterministic (seed any randomness, do not read clocks).

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
