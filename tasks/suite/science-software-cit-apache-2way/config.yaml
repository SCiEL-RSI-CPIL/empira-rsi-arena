# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 300
  max_retries: 2

prompt:
  system_message: |
    Software engineering: pairwise covering array for the Apache configuration model

    Build a smallest pairwise covering array for the 172-option Apache web-server model of Cohen et al., avoiding its forbidden option combinations. Every feasible pair of option settings must appear in some test configuration; fewer configurations is better.

    Candidate interface: generate(model) -> list of rows. model = {'name': str, 'strength': t, 'values': [v_0, ..., v_{k-1}], 'forbidden': [[[p, level], ...], ...]}: parameter p takes a level in 0..v_p-1 and each forbidden entry lists parameter-level pairs that must not all occur in one row. Return a list of rows, each a list of k Python ints. Every row must avoid all forbidden combinations, and the rows together must contain every combination of levels of t distinct parameters that occurs in at least one valid configuration (the evaluator decides feasibility exactly). Score: number of rows, minimised; an array that misses a feasible combination or contains a forbidden one is invalid. generate() runs in a sandboxed subprocess (no files, network or subprocesses; CPU limit 60 s for pairwise and 120 s for 3-way tasks, 2 GB); it should be deterministic (seed any randomness, do not read clocks).

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
