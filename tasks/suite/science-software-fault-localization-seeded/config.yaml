# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 300
  max_retries: 2

prompt:
  system_message: |
    Software engineering: spectrum-based fault localisation of seeded faults in three CPython modules

    Rank the code blocks of a faulty module by suspiciousness using only its program spectrum: for each block, how many failing and passing tests execute it. The 532 faults are first-order mutants of textwrap, urllib.parse and fractions; the score is the mean EXAM (rank of the faulty block divided by the number of blocks).

    Candidate interface: localize(spectrum) -> list of float. spectrum = {'subject': 'textwrap', 'urllib.parse' or 'fractions', 'blocks': n, 'failed': F, 'passed': P, 'ef': [n ints], 'ep': [n ints]} describes one faulty version of the module: F of its pool tests fail (their outcome differs from the correct module's) and P pass, and ef[b] (ep[b]) is the number of failing (passing) tests that execute block b, where blocks are the evaluator's block probes (function entries, branch outcomes, loop bodies and exits, handlers) in a random order that is drawn anew for every fault and every evaluation, so an index does not denote the same block in different faults or evaluations; the faults are presented in a random order as well. Return n finite numbers, a suspiciousness per block (higher means more likely faulty). Score: mean EXAM over the 532 faults, i.e. the faulty block's rank (ties count as their average rank) divided by n, minimised. localize() is called once per fault, all faults in one sandboxed subprocess (no files, network or subprocesses; 120 s CPU in total, 2 GB); it should be deterministic (seed any randomness, do not read clocks).

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
