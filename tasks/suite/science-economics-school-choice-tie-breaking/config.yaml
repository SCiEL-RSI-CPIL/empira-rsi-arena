# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 300
  max_retries: 2

prompt:
  system_message: |
    Economics: Efficient school choice under coarse priorities

    Assign students to schools when school priorities have many ties, improving on deferred acceptance with a single tie-breaking lottery (DA-STB) while keeping the matching weakly stable. The evaluator checks every student-school pair for blocking and scores the share of the possible reduction in total preference rank achieved on six synthetic markets.

    Candidate interface: assign_students(problem) -> array of S ints: the school of each student (-1 = unassigned). problem = {'students': S, 'schools': C, 'list_length': L, 'preferences': (S, L) school indices from most to least preferred, 'priorities': (S, C) ints (higher = higher priority, equal = tie; walk-zone tiers and siblings), 'capacities': (C,), 'lottery': (S,) the single tie-breaking order used by the DA-STB benchmark (lottery[0] wins all ties)}. Valid only if every student gets a school on her list or nothing, capacities hold, and the matching is weakly stable: no student prefers a school that has a free seat or admits someone of strictly lower priority there. Six fixed instances (150 to 300 students). Score: (total rank under DA-STB - total rank of the candidate) / (total rank under DA-STB - proven minimum total rank over weakly stable matchings), summed over instances; rank 1 is a first choice and unassigned counts L + 1 (maximize; the DA-STB seed scores 0 and the optimum 1)

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
