# SCiEL / OpenEvolve configuration generated by scripts/build_new_tasks.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 300
  max_retries: 2

prompt:
  system_message: |
    Spherical code, 42 points in dimension 3

    Place 42 points on the unit sphere in R^3 so that the smallest angle between two of them is as large as possible (the Tammes problem). The angle between two points is the angle at the centre of the sphere, the arccosine of the inner product of the two unit vectors.

    Candidate interface: construct() -> array of shape (42, 3): one point per row (the verifier scales every row to unit length; a zero or non-finite row is invalid). Score: smallest angle between two points in degrees, maximized.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
