# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 300
  max_retries: 2

prompt:
  system_message: |
    Finance: Forecasting the US Treasury yield curve

    Forecast end-of-month US Treasury zero-coupon yields at maturities of 1 to 10 years, 1, 6 and 12 months ahead, from the curves observed up to each origin between 1990 and 2024. The evaluator recomputes the forecast errors and scores the root-mean-square error relative to the random walk.

    Candidate interface: forecast_yields(history, horizons) -> (3, 10) float array: forecasts (percent) of the zero-coupon yields at maturities 1..10 years, 1, 6 and 12 months after the origin (rows follow horizons = [1, 6, 12]). history = {'yyyymm': (T,) ints, 'maturities': array 1.0..10.0 (years), 'yields': (T, 10) end-of-month Gurkaynak-Sack-Wright continuously compounded zero-coupon yields (percent) from 1972-01 through the origin month}. Called at the 415 month-end origins 1990-01..2024-07; |forecast| <= 30. Score: RMSE of the candidate divided by the RMSE of the random walk (no-change forecast), averaged over the three horizons and the maturities 1, 2, 3, 5, 7 and 10 years (minimize; the random-walk seed scores exactly 1). The candidate runs in a separate sandboxed process: numpy, scipy, scikit-learn, pandas and the other installed packages are importable, while the evaluator's library, its data files, the network and subprocesses are not accessible; one thread and 3 GB of memory. It receives only the arguments described here, one call at a time: the arguments of a call are sent after the value of the previous call has been received. Arguments and return values travel as numbers, strings, lists, dicts with string keys and numeric numpy arrays, so a tuple arrives as a list

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
