# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 360
  max_retries: 2

prompt:
  system_message: |
    Earth science: Great Lakes wave height from buoy meteorology

    Learn how wind and other meteorology at seven NOAA buoys on Lakes Superior, Michigan, Huron and Erie generate waves from 2009-2018 records, then hindcast the hourly significant wave height for 2019-2024 from the buoys' meteorology alone. The score is the root-mean-square error of the hindcast wave heights.

    Candidate interface: hindcast_waves(train, test) -> dict {buoy: float array (n_targets,)} of significant wave height (m, 0 to 20) at the target hours of each buoy. train and test map the NDBC buoys 45001, 45006 (Lake Superior), 45002, 45007 (Lake Michigan), 45003, 45008 (Lake Huron) and 45005 (Lake Erie) to dicts with lat, lon, hour (hours since 2009-01-01 00 UTC, one value per observed hour, ascending) and hourly arrays wdir (deg true, direction the wind comes from), wspd and gst (m/s, at the buoy's anemometer height), pres (hPa), atmp, wtmp and dewp (deg C), NaN when missing (for each field the valid value closest to the full hour). train covers 2009-2018 and also holds the wave fields wvht (significant wave height, m), dpd and apd (dominant and average period, s) and mwd (deg); test covers 2019-2024 without wave fields and holds target_index (float indices into hour where a wave height was observed). Meteorology at any test hour, earlier or later, may be used. The candidate runs in a separate sandboxed process (numpy, scipy, scikit-learn and pandas importable; no file, network or subprocess access; one thread) with 180 s of CPU time for fitting and all predictions together; seed any randomness so that results are deterministic. Score: root-mean-square error (m) over all 177719 target hours; lower is better. Missing buoys, wrong shapes, NaN or values outside [0, 20] m are invalid

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
