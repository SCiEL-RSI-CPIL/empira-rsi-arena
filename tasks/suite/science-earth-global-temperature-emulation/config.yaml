# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 150
  max_retries: 2

prompt:
  system_message: |
    Earth science: predicting recent global warming from forcing and early observations

    Fit a model of annual global mean surface temperature on the 1850-1979 HadCRUT5 record, given radiative forcing histories and an ENSO index for 1750-2024, and predict the 1980-2024 anomalies without seeing any later temperature. The score is the root-mean-square error of the predicted anomalies.

    Candidate interface: predict_gmst(training, inputs) -> float array (45,) of annual global mean near-surface temperature anomalies (deg C from 1961-1990, HadCRUT5 analysis) for 1980-2024. training holds year (1850-1979), gmst and its 95% range gmst_low, gmst_high. inputs holds forcing_year (1750-2024) and forcing, a dict of annual effective radiative forcing series (W m-2, Forster et al. 2025 update of IPCC AR6) for CO2, CH4, N2O, halogen, minor, O3, H2O_stratospheric, contrails, aerosol-radiation_interactions, aerosol-cloud_interactions, BC_on_snow, land_use, solar, volcanic, anthro and total; enso_year, enso_month and relative_nino34 (1854-01 to 2024-12: ERSSTv5 Nino 3.4 anomaly minus the 20S-20N mean SST anomaly, from 1951-1980 monthly climatologies); and predict_years (1980-2024). No temperature after 1979 is provided. The candidate runs in a separate sandboxed process (numpy, scipy, scikit-learn and pandas importable; no file, network or subprocess access; one thread) with 60 s of CPU time for fitting and all predictions together; seed any randomness so that results are deterministic. Score: root-mean-square error (deg C) of the 45 predicted anomalies against HadCRUT5; lower is better. Wrong shapes, NaN or values outside [-5, 5] deg C are invalid

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
