# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Minimal logarithmic energy of 150 points on the sphere

    Place 150 points on the unit sphere to minimize the logarithmic energy, the sum over all pairs of log(1/distance), the energy in Smale's 7th problem. The lowest published energy, -2364.632242592, is the putative global minimum: it is not proven minimal, but random-restart local optimisation reproduces it within seconds, so the task measures whether an optimiser reaches it.

    Candidate interface: construct() -> array of shape (N, 3) of nonzero vectors; each is normalised to the unit sphere. Score: the logarithmic energy sum_{i<j} log(1 / |x_i - x_j|) (natural logarithm, chordal distances, pair terms summed with math.fsum); minimize. Points closer than 1e-9, a wrong shape or non-finite values make the candidate invalid.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
