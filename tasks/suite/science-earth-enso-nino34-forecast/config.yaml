# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 240
  max_retries: 2

prompt:
  system_message: |
    Earth science: El Nino-Southern Oscillation forecasts of the Nino 3.4 index

    Fit a statistical ENSO forecast model on 1950-1999 ERSSTv5 sea-surface temperatures and, for every month from 2000 to 2024, forecast the monthly Nino 3.4 index for the next 12 months using only data up to that month. The score is the mean root-mean-square error over the 12 lead times.

    Candidate interface: fit_enso_model(training) -> model; model.forecast(history) -> float array (12,) of the Nino 3.4 area-mean sea-surface temperature (deg C, ERSSTv5) for each of the 12 months after the last month in history. training and history are dicts of numpy arrays over consecutive months: year, month (1-12), nino12, nino3, nino34 and nino4 (cosine-weighted mean SST, deg C, over grid cells centred in 0-10S 90-80W, 5N-5S 150-90W, 5N-5S 170-120W and 5N-5S 160E-150W) and sst (months, 31, 86): ERSSTv5 SST on its 2-degree grid for 30S-30N (latitude ascending) and 120E-70W (longitude 120 to 290 deg E), NaN over land; training also holds lat (31,) and lon (86,). training covers 1950-01 to 1999-12. Forecasts are then requested in order for every origin month from 2000-01 to 2024-12; history holds all months from 1950-01 up to and including the origin month and nothing later. The candidate runs in a separate sandboxed process (numpy, scipy, scikit-learn and pandas importable; no file, network or subprocess access; one thread) with 120 s of CPU time for fitting and all predictions together; seed any randomness so that results are deterministic. Score: mean over leads 1-12 of the root-mean-square error (deg C) over the 300 origins; lower is better. Wrong shapes, NaN or values outside [10, 40] deg C are invalid

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
