# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Quadratic assignment: QAPLIB wil100

    Assign the 100 facilities of the QAPLIB instance wil100 to 100 locations so that the sum of flow times distance is as small as possible. The best known assignment costs 273,038 and no optimality proof exists.

    Candidate interface: solve(a, b) -> permutation p of 0..n-1 (list of n integers); a and b are this task's QAPLIB matrices (int64 NumPy arrays of shape (n, n), first and second matrix of the instance file, passed as copies). Facility i is placed at location p[i]. Score: the exact integer cost sum_{i,j} a[i, j] * b[p[i], p[j]], minimized. The instance file is read from the prepared data directory and its SHA-256 is checked before every evaluation.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
