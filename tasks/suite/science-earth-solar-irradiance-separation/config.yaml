# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 360
  max_retries: 2

prompt:
  system_message: |
    Earth science: diffuse solar irradiance from global irradiance at unseen stations

    Learn a separation model from 1-minute measurements of global, direct and diffuse solar irradiance at four NOAA SURFRAD stations and estimate the diffuse irradiance at three other stations from their global irradiance, solar geometry and meteorology on 48 days of 2022-2023. The score is the root-mean-square error of the estimated diffuse irradiance.

    Candidate interface: estimate_diffuse(train, test) -> dict {station: float array (n_targets,)} of 1-minute diffuse horizontal irradiance (W m-2, 0 to 1500) at the target minutes of each test station. train (Bondville, Desert Rock, Fort Peck, Goodwin Creek: bon, dra, fpk, gwn) and test (Penn State, Sioux Falls, Table Mountain: psu, sxf, tbl) map station codes to dicts with lat, lon, elevation_m and arrays over every daytime minute (solar zenith < 90 deg) of days 8, 23, ..., 353 of 2022 and 2023: day (days since 2022-01-01), minute (UTC minute of day), zen (solar zenith angle, deg), ghi (global horizontal irradiance), e0_horizontal (1361 (1 + 0.033 cos(2 pi doy/365)) cos(zen)), temp (deg C), rh (%), pres (hPa), NaN where SURFRAD's quality flag is not 0, and target_index (float indices of the scored minutes). train also holds dni (direct normal) and dhi (diffuse) irradiance; test does not. Measurements at any minute of a test day may be used. The candidate runs in a separate sandboxed process (numpy, scipy, scikit-learn and pandas importable; no file, network or subprocess access; one thread) with 180 s of CPU time for fitting and all predictions together; seed any randomness so that results are deterministic. Score: root-mean-square error (W m-2) over the 87316 test-station target minutes (zenith < 85 deg, GHI >= 10 W m-2, all three components flagged good and closing within max(20 W m-2, 8 percent of GHI)); lower is better. Missing stations, wrong shapes, NaN or values outside [0, 1500] are invalid

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
