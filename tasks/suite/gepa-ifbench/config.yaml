# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 900
  max_retries: 2

prompt:
  system_message: |
    IFBench

    Write a Python solve(question, llm) agent that uses a budgeted OpenRouter model client to answer IFBench prompts, each carrying verifiable output constraints; scored by the mean fraction of instructions the IFBench checkers accept under GEPA's loose rule, on a fixed 30-prompt sample of the 294-prompt test set (higher is better).

    Candidate interface: solve(question: str, llm) -> str. `question` is an IFBench prompt (a user request with one or more verifiable output constraints); the returned text is the response that the IFBench instruction checkers verify. `llm(prompt_or_messages, system=None, max_tokens=None, temperature=None, json_mode=False) -> str` is a budgeted, cached OpenRouter chat client. Score: mean over a fixed seeded sample of prompts of the fraction of instructions followed under GEPA's loose rule (the response, or the response without its first and/or last line and/or without asterisks, passes the checker); higher is better

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
