# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 420
  max_retries: 2

prompt:
  system_message: |
    Software engineering: mutation-adequate test generation for CPython's fractions

    Generate at most 30 test calls for fractions.Fraction (parsing, arithmetic, rounding, formatting) that distinguish as many of its 453 first-order mutants as possible from the original module. A mutant is killed when some test's result or exception type differs; the score is the fraction killed.

    Candidate interface: generate_tests(subject) -> list of tests. subject = {'subject': str, 'files': {path: source} (CPython 3.12.14), 'target': path of the mutated module, 'api': {call: [argument kinds]}, 'mutants': [{'unit', 'operator', 'line', 'start', 'end', 'replacement'}, ...], 'max_tests': 30}. A test is {'call': name, 'args': [values]}. Argument kinds: 'str' (at most 500 characters), 'int' (|n| <= 10000), 'opt_int' (such an int or None), 'bool', 'float' (finite, |x| <= 1e6), 'fraction' (a str of at most 30 characters for Fraction(), with an exponent of at most two digits), 'spec' (a format spec of at most 12 characters without runs of four digits), 'number' (a 'fraction' str, an int with |n| <= 1000 or a float), 'numbers' (a list of at most 40 values, each a 'fraction' str, an int with |n| <= 10000 or a float with |x| <= 1e6), 'pairs' (at most 20 [str, str] pairs of at most 100 characters each), {'options': {keyword: kind}} (keyword arguments), {'strings': n} (exactly n strings), {'choice': [allowed values]}. Calls: textwrap: wrap/fill/shorten(text, width, options) -> textwrap.<call>(text, width, **options), dedent(text), indent(text, prefix); urllib.parse: each call is the function of that name with the arguments in order (urlparse/urlsplit(url, scheme, allow_fragments), urljoin(base, url, allow_fragments), parse_qs/parse_qsl(qs, keep_blank_values, strict_parsing, max_num_fields, separator), quote/quote_plus(string, safe)), urlunparse/urlunsplit get the strings as a tuple, urlencode(pairs, doseq, safe) passes the pairs as tuples; fractions: parse(s) -> Fraction(s), make(n, d) -> Fraction(n, d), from_float(x), binary(a, op, b) applies the operator (or divmod, max) to a and b with str operands converted by Fraction, limit_denominator(s, m), round(s, ndigits) (round(Fraction(s)) when ndigits is None), format(s, spec) -> format(Fraction(s), spec), method(s, name) -> getattr(Fraction(s), name)(); statistics (str values become Fraction): summary(name, data) -> statistics.<name>(data), median_grouped(data, interval), quantiles(data, n, method), weighted(name, data, weights) -> fmean or harmonic_mean with weights, spread_given_center(name, data, c) -> variance/pvariance/stdev/pstdev(data, c), bivariate(name, x, y) -> covariance, correlation (linear or ranked) or linear_regression (proportional or not), normal(mu, sigma, method, x) -> NormalDist(mu, sigma).method(x) (quantiles(int(x)) for 1 <= x <= 1000, overlap(NormalDist(x, 1.0))), from_samples(data). A mutant is the target file with lines start..end replaced by 'replacement'; it is killed when some test's outcome differs from the original module's outcome, where the outcome is a hash of the repr of the result (generators consumed, at most 10,001 items) or the type name of the raised exception, with 0.2 s of CPU time per call; tests that time out on the original are ignored. Score: killed mutants / all mutants, maximised (equivalent mutants make 1.0 unreachable); the whole mutation analysis may take at most 240 s of CPU time, otherwise the evaluation is invalid. generate_tests() runs in a sandboxed subprocess (no files, network or subprocesses; 60 s CPU, 2 GB) and may load the files and mutants itself; it should be deterministic (seed any randomness, do not read clocks). Invalid tests make the evaluation invalid.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
