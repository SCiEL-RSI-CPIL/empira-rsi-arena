# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Difference triangle set (4,7)

    Choose 4 rows of 8 increasing integers starting at 0 so that all differences between two entries of the same row are distinct over all rows, with the largest entry as small as possible. The best known set has largest entry 134 (Shehadeh, Kingsford and Kschischang, 2025); the simple counting bound is 112.

    Candidate interface: construct(n_rows, k) -> list of n_rows rows; the evaluator passes this task's n_rows and k. Each row is a list of k + 1 integers that starts at 0 and increases strictly. Valid when all positive differences a_j - a_i (i < j) inside the rows are distinct over all rows. Score: the scope, the largest entry, minimized; it is an upper bound on m(n_rows, k).

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
