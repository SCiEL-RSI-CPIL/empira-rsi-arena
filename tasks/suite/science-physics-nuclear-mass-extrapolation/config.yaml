# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 180
  max_retries: 2

prompt:
  system_message: |
    Physics: predicting newly measured nuclear masses from the AME2016 evaluation

    Fit a nuclear mass model on the experimental masses of the 2016 Atomic Mass Evaluation and predict the mass excesses of the 71 nuclides first measured in time for AME2020. The candidate never sees the AME2020 values, and the score is the root-mean-square deviation from them in keV.

    Candidate interface: predict_masses(training, queries) -> list of len(queries) atomic mass excesses in keV. training is a list of dicts with keys N, Z, A, element, mass_excess_keV and uncertainty_keV: the 2408 experimental (non-estimated) entries of the Atomic Mass Evaluation 2016 with N, Z >= 8. queries is a list of [N, Z] pairs: the 71 nuclides with N, Z >= 8 that are experimental in AME2020 but were missing or only estimated in AME2016. predict_masses runs in a sandboxed subprocess that never sees the AME2020 values, with a 120 s CPU budget. Score (minimize): root-mean-square deviation in keV between the predictions and the AME2020 mass excesses; predictions outside [-200000, 300000] keV, NaN or a wrong length are invalid

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
