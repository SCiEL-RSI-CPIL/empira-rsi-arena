# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 300
  max_retries: 2

prompt:
  system_message: |
    Economics: Maximum Nash welfare allocation of indivisible goods

    Allocate indivisible goods among agents with additive Spliddit-style valuations to maximize Nash welfare, the geometric mean of the agents' utilities. The evaluator recomputes each allocation's Nash welfare and compares it with the proven optimum on eight fixed instances with 4 to 15 agents.

    Candidate interface: allocate(values) -> list of m agent indices, the owner of each good. values is an (n, m) int array; row i holds agent i's additive values for the m indivisible goods and sums to 1000 (Spliddit-style point split). Eight fixed instances with (n, m) = (4, 16), (5, 20), (6, 24), (8, 32), (10, 40), (12, 48), (15, 60), (15, 60). Nash welfare is the geometric mean of the agents' utilities (0 if any agent gets nothing). Score: mean over instances of Nash welfare divided by the proven maximum Nash welfare (maximize; 1 is optimal); envy-freeness up to one good is reported per instance. The candidate runs in a separate sandboxed process: numpy, scipy, scikit-learn, pandas and the other installed packages are importable, while the evaluator's library, its data files, the network and subprocesses are not accessible; one thread and 3 GB of memory. It receives only the arguments described here, one call at a time: the arguments of a call are sent after the value of the previous call has been received. Arguments and return values travel as numbers, strings, lists, dicts with string keys and numeric numpy arrays, so a tuple arrives as a list

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
