# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 300
  max_retries: 2

prompt:
  system_message: |
    Sutton-Chen transition-metal cluster global minima

    Find the lowest-energy structures of 38- to 80-atom clusters of the Sutton-Chen many-body metal potential with the silver, nickel and gold parameter sets (six instances). Energies are recomputed exactly and compared with the putative global minima of Doye and Wales.

    Candidate interface: construct(instance) -> array of shape (n, 3): Cartesian coordinates of n atoms in reduced units (lattice constant 1). instance = {'potential': 'sutton_chen', 'kind': '12-6' | '9-6' | '10-8', 'n': atoms, 'n_exp', 'm_exp', 'c'}; called once for each of six instances (kind, n) = (12-6, 38), (12-6, 75), (9-6, 59), (9-6, 80), (10-8, 55), (10-8, 79); all calls together within 300 s, at most 4 threads. The evaluator recomputes E = sum_i [1/2 sum_{j!=i} r_ij^-n_exp - c sqrt(sum_{j!=i} r_ij^-m_exp)] over all pairs (no cutoff) with (n_exp, m_exp, c) = (12, 6, 144.41), (9, 6, 39.432), (10, 8, 34.408); atoms must be at least 0.35 apart. Score: mean over instances of 100*(E - E_pub)/|E_pub| against the putative global minima tabulated by Doye and Wales (1998) (minimize; 0 matches all six, negative is lower). chem_clusters.relax(positions, 'sutton_chen', kind) and chem_clusters.sutton_chen_energy_gradient(positions, kind) may be called

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
