# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 240
  max_retries: 2

prompt:
  system_message: |
    Earth science: Atlantic hurricane wind-radii (storm size) forecasting

    Fit a model of tropical-cyclone size on the 2004-2014 Atlantic best track and forecast the radius of 34-kt winds in four quadrants 12-72 h ahead for every analysed time of the 2015-2024 storms, given the storm's history and its best-track track and intensity at the verifying times. The score is the mean absolute radius error.

    Candidate interface: fit_radii_model(training_storms) -> model; model.forecast(history, future) -> float array (5, 4) of 34-kt wind radii (n mi) in the NE, SE, SW and NW quadrants at 12, 24, 36, 48 and 72 h. training_storms is a list of the 2004-2014 Atlantic HURDAT2 storms as dicts with numpy arrays time_hours (hours since 2004-01-01 00 UTC), lat (deg N), lon (deg E, west negative), vmax_kt, mslp_hpa (NaN when missing) and r34, r50, r64 ((n, 4) radii in n mi for NE, SE, SW, NW; 0 where the threshold is not reached in a quadrant, NaN when not analysed), plus status (list of HURDAT2 codes) and year, one entry per 6-hourly synoptic record. Forecasts are requested in chronological order from every 6-hourly record of a 2015-2024 storm that is TS, HU or SS with maximum wind >= 34 kt and analysed 34-kt radii and that verifies at one or more leads; history holds that storm's records up to and including the forecast time (same fields); future holds lead_hours, verifies (1 or 0) and the best-track lat, lon, vmax_kt and mslp_hpa at each lead (NaN where the lead does not verify). A lead verifies when the storm is then TS, HU or SS with maximum wind >= 34 kt and analysed 34-kt radii. The candidate runs in a separate sandboxed process (numpy, scipy, scikit-learn and pandas importable; no file, network or subprocess access; one thread) with 120 s of CPU time for fitting and all predictions together; seed any randomness so that results are deterministic. Score: mean over the five leads of the mean absolute error (n mi) over verifying cases and the four quadrants; lower is better. Wrong shapes, NaN or values outside [0, 1000] n mi are invalid

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
