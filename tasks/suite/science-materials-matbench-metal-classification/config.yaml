# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 900
  max_retries: 2

prompt:
  system_message: |
    Matbench: metal or non-metal from composition

    Classify 4921 inorganic compounds as metals or non-metals from their composition alone, using experimental band-gap reports. The evaluator scores the balanced accuracy (Matbench's ROC AUC for label predictions) over the five official cross-validation folds.

    Candidate interface: fit_predict(train_inputs, train_targets, test_inputs, info) -> list of len(test_inputs) labels, each 0 or 1 (1 = metal). Inputs are compositions {'formula': str, 'composition': {element: amount}}; training targets are 0/1. Called once per official Matbench v0.1 fold (five calls), each in a fresh process that receives that fold's training inputs with labels and its held-out inputs without labels; info = {'task', 'input_type', 'target', 'unit', 'fold', 'n_train', 'n_test'}. Runs in a separate process that receives only these arguments (no test values), with at most 4 threads (OMP/MKL/OpenBLAS set to 4), no network, no subprocesses and no read access to the repository or prepared data; numpy, scipy, scikit-learn and RDKit are importable (pandas and torch only where the environment provides them; they are not requirements of the task); wall-clock limit 170 s per fold. Score: mean over the five folds of the balanced accuracy of the labels, the "mean balanced accuracy" column of the Matbench leaderboard (for 0/1 labels it equals the binary ROC AUC) (maximize); accuracy and F1 are reported

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
