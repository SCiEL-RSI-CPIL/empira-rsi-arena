# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 600
  max_retries: 2

prompt:
  system_message: |
    Finance: Daily volatility forecasting for US equity portfolios

    Forecast the next day's return variance of the US stock market and 49 industry portfolios, updating the forecasts day by day from 2000 to 2025 after a training period ending in 1999. The evaluator reveals each day's returns only after the forecasts are made and scores the QLIKE loss against squared returns.

    Candidate interface: make_forecaster(training_returns, names) -> object with forecast() and update(returns). training_returns is a (7280, 50) float array of daily returns (decimal) from 1971-03-12 to 1999-12-31: column 0 is the CRSP value-weighted market (Mkt-RF + RF), columns 1-49 the value-weighted Fama-French industries; names lists the 50 series. The evaluator then walks through the 6,475 trading days 2000-01-03..2025-09-30: forecast() must return a (50,) array of next-day return variances in [1e-10, 1]; afterwards update(r) receives that day's (50,) returns. Score: mean QLIKE loss log(h) + r^2/h over all days and series (minimize); the RiskMetrics EWMA benchmark (lambda 0.94), the difference and a Diebold-Mariano statistic are reported

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
