# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Finance: Optimal execution under Almgren-Chriss market impact

    Schedule the sale of a large block of shares over a fixed horizon to minimize expected trading cost plus a variance penalty in the Almgren-Chriss market-impact model, including power-law impact and an intraday liquidity profile. The evaluator recomputes each schedule's cost-risk objective exactly and compares it with the known optimum on 12 fixed instances.

    Candidate interface: trade_schedule(problem) -> array of N nonnegative trade sizes n_1..n_N (shares sold in each period) summing to X (within 1e-6 relative; an accepted schedule is clipped at zero and rescaled to sum exactly to X before it is scored). problem = {'shares': X, 'periods': N, 'horizon_days': T, 'tau': T/N, 'price': 50.0, 'sigma': (N,) volatility per period ($/share/day^0.5), 'eta': (N,) temporary-impact coefficients, 'beta': impact exponent (1 = linear), 'epsilon': fixed cost ($/share), 'gamma': linear permanent impact ($/share^2), 'risk_aversion': lambda (1/$), 'name': str}. Discrete Almgren-Chriss objective: E = gamma*X^2/2 - gamma*sum(n_k^2)/2 + epsilon*sum|n_k| + sum_k tau*eta_k*|n_k/tau|^(1+beta); V = tau*sum_k sigma_k^2*x_k^2 with holdings x_k = X - (n_1+...+n_k); U = E + lambda*V. Twelve fixed instances: Almgren-Chriss Table 1 parameters with varied N, lambda and volatility, power-law impact (beta 0.6 and 0.5) and U-shaped intraday liquidity and volatility. Score: mean over instances of 100*(U - U*)/U*, where U* is the exact optimum (closed form for constant linear impact, otherwise a convex solve); minimize, 0 is optimal. The candidate runs in a separate sandboxed process: numpy, scipy, scikit-learn and the other installed packages are importable, while the evaluator's library, its data files, the network and subprocesses are not accessible; one thread and 3 GB of memory. It receives only the arguments described here, one call at a time: the arguments of a call are sent after the value of the previous call has been received. Arguments and return values travel as numbers, strings, lists, dicts with string keys and numeric numpy arrays, so a tuple arrives as a list

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
