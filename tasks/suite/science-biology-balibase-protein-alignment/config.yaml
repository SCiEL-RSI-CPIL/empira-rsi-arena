# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 300
  max_retries: 2

prompt:
  system_message: |
    Biology: protein multiple-alignment accuracy on BAliBASE reference alignments

    Align the unaligned protein sequences of 26 BAliBASE reference-1 test cases, spanning very divergent and medium-divergence families. The evaluator checks that each alignment is a valid gapped version of the input sequences and scores the sum-of-pairs agreement with the structure-based reference alignment on its annotated core blocks.

    Candidate interface: align(sequences) -> list of aligned rows, one per input sequence, all of the same length, each row equal to its input sequence with '-' gap characters inserted (upper-case amino acids). sequences is a list of 4 to 10 unaligned protein sequences of a BAliBASE reference-1 test case. align is called once per test case in a sandboxed subprocess with a 240 s CPU budget for all 26 cases. Score (maximize): mean sum-of-pairs score over the cases, i.e. the fraction of residue pairs that the structure-based reference alignment places in the same core-block column and the candidate also aligns; the total-column score is reported alongside

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
