# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 300
  max_retries: 2

prompt:
  system_message: |
    Software engineering: log parsing (event template identification) on the 16 Loghub-2k data sets

    Group the messages of 16 system logs (2,000 lines each, from HDFS, Hadoop, Spark, Linux, OpenSSH and others) by the log statement that produced them, given only the message texts. The score is the mean grouping accuracy against the corrected ground-truth events.

    Candidate interface: parse(dataset) -> list. dataset = {'name': one of Android, Apache, BGL, HDFS, HPC, Hadoop, HealthApp, Linux, Mac, OpenSSH, OpenStack, Proxifier, Spark, Thunderbird, Windows, Zookeeper, 'messages': [2000 str]} gives the message contents of 2,000 log lines of one system in their original order (header fields such as time, level and component already removed). Return one group label (int or str) per message; messages with equal labels are claimed to come from the same log statement (event template). Grouping accuracy of a data set: the share of messages whose group contains exactly the messages of their ground-truth event, no more and no fewer. Score: mean grouping accuracy over the 16 data sets, maximised. parse() is called once per data set, all data sets in one sandboxed subprocess (no files, network or subprocesses; 120 s CPU in total, 2 GB); per-data-set settings are allowed, as in the published benchmarks; it should be deterministic (seed any randomness, do not read clocks).

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
