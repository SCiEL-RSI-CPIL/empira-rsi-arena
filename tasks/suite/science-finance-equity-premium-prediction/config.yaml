# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 300
  max_retries: 2

prompt:
  system_message: |
    Finance: Out-of-sample equity-premium prediction

    Forecast next month's US equity premium (the log S&P 500 return over the T-bill rate) from the Welch-Goyal predictors observed up to the forecast origin. The evaluator recomputes the out-of-sample R^2 against the prevailing historical mean over 732 monthly forecasts from 1965-01 to 2025-12.

    Candidate interface: forecast_premium(history) -> float: forecast of next month's log equity premium log(1+R_m) - log(1+R_f) (decimal, |forecast| <= 0.5). history is a dict of 1-D float arrays from 1871-01 through the forecast origin month t (NaN where a series is unavailable): the Welch-Goyal columns 'Index', 'D12', 'E12', 'b/m', 'tbl', 'AAA', 'BAA', 'lty', 'ntis', 'Rfree', 'infl', 'ltr', 'corpr', 'svar', 'csp', 'CRSP_SPvw', 'CRSP_SPvwx' (decimal rates; inflation of month t is withheld because the CPI is published with a lag), 'yyyymm' (integers) and 'equity_premium' (log excess return of each month, NaN before 1926-01). Called once per origin for the 732 targets 1965-01..2025-12. Score: Campbell-Thompson out-of-sample R^2 in percent against the prevailing mean of the equity premium since 1926-01 (maximize; the seed scores exactly 0). The candidate runs in a separate sandboxed process: numpy, scipy, scikit-learn and the other installed packages are importable, while the evaluator's library, its data files, the network and subprocesses are not accessible; one thread and 3 GB of memory. It receives only the arguments described here, one call at a time: the arguments of a call are sent after the value of the previous call has been received. Arguments and return values travel as numbers, strings, lists, dicts with string keys and numeric numpy arrays, so a tuple arrives as a list

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
