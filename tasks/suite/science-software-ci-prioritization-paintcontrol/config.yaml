# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 240
  max_retries: 2

prompt:
  system_message: |
    Software engineering: history-based test prioritisation in continuous integration (ABB Paint Control)

    Order the test cases of each of the 352 continuous-integration cycles of ABB's Paint Control system so that failing tests run early, using only the verdicts of earlier cycles. Each cycle's verdicts are revealed after its order is committed; the score is the mean APFD over cycles with both failing and passing tests.

    Candidate interface: prioritize(cycle, history) -> list of int. cycle = {'cycle': int, 'tests': [{'id': int, 'duration': int}, ...]} lists the test cases of one continuous-integration cycle, sorted by id (durations are the data set's approximate run times). history lists every earlier cycle in order as {'cycle': int, 'tests': [{'id', 'duration', 'failed': bool}, ...]}. Return a permutation of the cycle's test ids, the test to run first first. A cycle's verdicts are revealed, by appending it to history, only after its order has been committed. Score: mean APFD over the cycles that contain both failing and passing tests, maximised; APFD = 1 - (sum of the 1-based positions of the m failing tests) / (n m) + 1 / (2 n) for a cycle of n tests, so a random order scores 0.5 in expectation. prioritize() is called once per cycle, all cycles in one sandboxed subprocess (no files, network or subprocesses; 60 s CPU in total, 2 GB); module-level state persists between calls. It should be deterministic (seed any randomness, do not read clocks); an invalid order makes the evaluation invalid.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
