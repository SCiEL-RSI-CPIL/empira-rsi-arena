# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 300
  max_retries: 2

prompt:
  system_message: |
    Dzugutov cluster global minima (polytetrahedral model metal)

    Find the lowest-energy structures of 38- to 60-atom clusters bound by the Dzugutov potential, a model of glass- and quasicrystal-forming metals whose energy maximum favours polytetrahedral order (six instances). Energies are recomputed exactly and compared with the putative global minima of Doye, Wales and Simdyankin.

    Candidate interface: construct(instance) -> array of shape (n, 3): Cartesian coordinates of n atoms in reduced units. instance = {'potential': 'dzugutov', 'n': atoms, 'A', 'B', 'a', 'b', 'c', 'd', 'm'}; called once for each n in (38, 45, 50, 55, 57, 60); all calls together within 300 s, at most 4 threads. The evaluator recomputes E = sum_{i<j} V(r_ij) with V(r) = A(r^-m - B)exp(c/(r - a)) [r < a] + B exp(d/(r - b)) [r < b], A = 5.82, B = 1.28, a = 1.87, b = 1.94, c = 1.10, d = 0.27, m = 16; atoms must be at least 0.5 apart. Score: mean over instances of 100*(E - E_pub)/|E_pub| against the putative global minima of Doye, Wales and Simdyankin (2001) (minimize; 0 matches all six, negative is lower). chem_clusters.relax(positions, 'dzugutov') and chem_clusters.dzugutov_energy_gradient(positions) may be called

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
