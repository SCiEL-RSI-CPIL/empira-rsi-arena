# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Football pool problem for 8 matches: ternary covering code K_3(8,1)

    Choose as few words of length 8 over the alphabet {0,1,2} as possible so that every one of the 6561 words differs from some chosen word in at most one position. The best known code has 486 words (van Laarhoven, Aarts, van Lint and Wille, 1989) and the best lower bound is 403.

    Candidate interface: construct(q, n, radius) -> list of codewords; the evaluator passes this task's alphabet size q, length n and covering radius. Each codeword is a list of n integers in 0..q-1 and codewords must be distinct. Valid when every word of {0..q-1}^n is within Hamming distance radius of some codeword (checked over the whole space). Score: the number of codewords, minimized; it is an upper bound on K_q(n, radius).

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
