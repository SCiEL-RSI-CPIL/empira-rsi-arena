# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Fifty equal circles in a circle

    Place the centres of 50 equal, non-overlapping circles inside a circle of radius 1 so that their common radius is as large as possible. The best known packing, with radius 0.1258254895304, was found by Graham, Lubachevsky, Nurmela and Östergård in 1998 and is not proven optimal.

    Candidate interface: construct() -> array of shape (N, 2): centres of N equal circles inside the unit circle (radius 1, centred at the origin). Score: the largest common radius r = min(min_{i<j} |c_i - c_j| / 2, min_i (1 - |c_i|)) for which the circles are disjoint and inside the container, computed in double precision; maximize. A centre on or outside the container, coincident centres, a wrong shape or non-finite values make the candidate invalid.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
