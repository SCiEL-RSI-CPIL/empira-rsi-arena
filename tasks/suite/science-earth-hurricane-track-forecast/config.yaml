# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 300
  max_retries: 2

prompt:
  system_message: |
    Earth science: Atlantic hurricane track forecasting from the best track

    Fit a statistical tropical-cyclone track model on the 1950-2014 Atlantic best track and forecast 12-120 h centre positions for every advisory-time record of the held-out 2015-2024 storms. The score is the mean great-circle track error over seven lead times.

    Candidate interface: fit_track_model(training_storms) -> model; model.forecast(history) -> float array (7, 2) of [latitude deg N, longitude deg E] forecast centre positions at 12, 24, 36, 48, 72, 96 and 120 h. Storms are dicts with read-only arrays time_hours (hours since 1950-01-01 00 UTC), month, day, hour, day_of_year, lat (deg N), lon (deg E, west negative), vmax_kt, mslp_hpa (NaN when missing), plus year (int) and status (tuple of HURDAT2 codes TD, TS, HU, EX, SD, SS, LO, WV, DB), one entry per 6-hourly synoptic record. training_storms are the 1950-2014 Atlantic HURDAT2 storms. Forecasts are requested in chronological order for every 6-hourly record of a held-out 2015-2024 storm at which it is TD/TS/HU/SD/SS and that verifies at one or more leads; history holds that storm's records up to and including the forecast time and nothing later. A lead verifies only if the storm is still TD/TS/HU/SD/SS at the verifying time (NHC convention). Score: mean over the seven leads of the mean great-circle distance (km, sphere radius 6371 km) between forecast and best-track positions; lower is better. Latitudes outside [-90, 90], longitudes outside [-360, 360], NaN or wrong shapes are invalid

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
