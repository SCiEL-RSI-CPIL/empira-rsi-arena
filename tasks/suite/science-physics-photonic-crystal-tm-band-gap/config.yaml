# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 200
  max_retries: 2

prompt:
  system_message: |
    Physics: photonic-crystal unit cell with a large higher-order TM band gap

    Design a symmetric 32x32-pixel unit cell of air and dielectric (epsilon 12) for a two-dimensional square-lattice photonic crystal that opens the largest gap between the fourth and fifth TM bands. The evaluator solves the band structure with an exact-coefficient plane-wave method over the irreducible Brillouin zone and scores the gap-midgap ratio.

    Candidate interface: design(problem) -> 32 x 32 nested list of 0/1 pixels of one square unit cell (1 = dielectric with epsilon 12, 0 = air), invariant under the square symmetry group about the cell centre (cell == cell[::-1] row-wise and column-wise and cell == its transpose). problem gives pixels 32, eps_low 1, eps_high 12, lower_band 4 and polarization TM. design runs in a sandboxed subprocess with a 120 s CPU budget. The evaluator computes TM bands with a 289-plane-wave Galerkin method using the exact Fourier coefficients of the pixel map, on 30 wave vectors covering the boundary and interior of the irreducible Brillouin zone. Score (maximize): gap-midgap ratio 2 (min omega_5 - max omega_4) / (min omega_5 + max omega_4) between TM bands 4 and 5; negative when the bands overlap

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
