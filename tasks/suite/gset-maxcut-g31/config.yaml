# SCiEL / OpenEvolve configuration generated by scripts/build_new_tasks.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 600
  max_retries: 2

prompt:
  system_message: |
    Max-cut, G-set G31

    Partition the 2000 vertices of the G-set graph G31 into two sides so that the total weight of the edges whose endpoints are on different sides is as large as possible (max-cut). The graph is undirected and has 19990 edges, each given once; every edge has weight 1 or -1, and an edge of weight -1 that is cut lowers the total.

    Candidate interface: solve(n, edges) -> sequence of n integers, each 0 or 1: the side of every vertex. edges is an int64 array with one row (i, j, w) per edge, vertices numbered from 0. Score: total weight of the edges whose endpoints are on different sides, maximized.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
