# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 360
  max_retries: 2

prompt:
  system_message: |
    Earth science: snow water equivalent from snow depth at unseen stations

    Convert daily snow depth to snow water equivalent at 48 held-out SNOTEL stations across the western United States and Alaska, after learning from 114 other stations with both measurements over water years 2006-2025. The score is the root-mean-square error of snow water equivalent on the held-out stations' snow days.

    Candidate interface: estimate_swe(train, test) -> dict {station_triplet: float array (n_targets,)} of snow water equivalent (mm, 0 to 10000) on the held-out target days of each test station. train and test map SNOTEL station triplets to dicts with state, lat, lon, elevation_m, precip_normal_mm (median water-year precipitation 2006-2015), day (days since 1970-01-01 of every day with a valid or edited snow-depth value, water years 2006-2025), depth_cm (snow depth on those days) and target_index (float indices into day of the scored days: depth >= 10.16 cm, SWE >= 10.16 mm, bulk density 0.05-0.65, both values flagged valid); train stations (114) also hold swe_mm (snow-pillow SWE on every day, NaN when not valid), test stations (48, 30 percent of each state) do not. Depth on all days, including later ones, may be used. The candidate runs in a separate sandboxed process (numpy, scipy, scikit-learn and pandas importable; no file, network or subprocess access; one thread) with 180 s of CPU time for fitting and all predictions together; seed any randomness so that results are deterministic. Score: root-mean-square error (mm) over the 103150 held-out target days; lower is better. Missing stations, wrong shapes, NaN or values outside [0, 10000] mm are invalid

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
