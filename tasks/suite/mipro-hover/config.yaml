# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 1800
  max_retries: 2

prompt:
  system_message: |
    HoVer

    Write a Python solve(claim, search, llm) program that retrieves, with at most 3 BM25 searches and 24 documents over 5.2 million 2017 Wikipedia abstracts and a budgeted OpenRouter model, the three gold supporting documents of a HoVer claim; scored by the fraction of claims whose gold titles were all retrieved, on a fixed 30-claim sample (higher is better).

    Candidate interface: solve(claim: str, search, llm) -> any (the return value is not used). search(query: str, k: int = 7) -> list[str] returns up to k documents 'title | abstract' ranked by BM25 (bm25s, k1 0.9, b 0.4, English stopwords, Snowball stemming) over the 5.2 million 2017 Wikipedia abstracts; per claim at most 3 search calls, k from 1 to 10 per call and at most 24 documents in total (a call beyond the budget raises RuntimeError). llm(prompt_or_messages, system=None, max_tokens=None, temperature=None, json_mode=False) -> str is a budgeted, cached OpenRouter chat client. A claim is solved when the titles of all its gold supporting documents (three distinct Wikipedia articles) are among the documents that search returned for it (titles compared after NFD normalisation, lower-casing and removal of punctuation, articles and extra spaces). Score: fraction of solved claims on a fixed seeded sample of GEPA's HoVer test split; higher is better. The program runs in a sandbox without file or network access (standard library and numpy only)

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
