# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 240
  max_retries: 2

prompt:
  system_message: |
    XLA/Enzyme-JAX e-graph extraction

    XLA/Enzyme-JAX e-graph extraction task evaluated in Magellan: Autonomous Discovery of Novel Compiler Optimization Heuristics with AlphaEvolve.

    Candidate interface: extract(egraph) -> dict mapping e-class id (str) to the chosen e-node id (str). egraph is an egraph-serialize JSON object: nodes = {node id: {op, cost (float), eclass, children: [child e-node ids]}} where a child e-node id stands for that node's e-class, and root_eclasses = [e-class ids]. Every root and every e-class reachable from the roots through chosen e-nodes must be chosen, each chosen e-node must belong to its e-class and the chosen graph must be acyclic. Score (minimize): geometric mean over the e-graphs of the DAG cost (the chosen e-node cost of each reachable e-class, counted once) divided by a reference extractor's DAG cost; each extract call must finish within time_limit_s wall-clock seconds

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
