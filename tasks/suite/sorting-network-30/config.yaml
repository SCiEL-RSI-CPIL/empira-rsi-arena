# SCiEL / OpenEvolve configuration generated by scripts/build_new_tasks.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 900
  max_retries: 2

prompt:
  system_message: |
    Sorting network on 30 inputs

    Construct a sorting network on 30 wires with as few comparators as possible. A comparator (i, j) with i < j compares the values on wires i and j and puts the smaller one on wire i and the larger one on wire j; the comparators are applied in the given order. The network must sort every input, that is, leave the values in non-decreasing order along wires 0 to 29.

    Candidate interface: construct() -> list of comparators (i, j) with 0 <= i < j < 30, in the order in which they are applied (at least one). The network is verified on all 2^30 inputs of zeros and ones, which is equivalent to sorting every input. Score: number of comparators, minimized (the depth is not scored).

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
