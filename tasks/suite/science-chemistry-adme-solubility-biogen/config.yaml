# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 600
  max_retries: 2

prompt:
  system_message: |
    ADME: aqueous solubility of drug-like compounds (Biogen public set)

    Predict the aqueous solubility at pH 6.8 (log10 ug/mL) of 435 test compounds from 1738 training compounds measured in the same Biogen assay. The evaluator scores the mean absolute error on the authors' official test split.

    Candidate interface: predict(train_smiles, train_values, test_smiles, info) -> list of len(test_smiles) floats: predicted log10 property values of the test molecules. The training split of the Biogen public ADME set (Fang et al. 2023; official split of molecularinformatics/Computational-ADME) is given as SMILES with measured log10 values, the test split as SMILES only; info = {'endpoint', 'property', 'n_train', 'n_test'}. Runs in a separate process that receives only these arguments (no test values), with at most 4 threads (OMP/MKL/OpenBLAS set to 4), no network, no subprocesses and no read access to the repository or prepared data; numpy, scipy, scikit-learn and RDKit are importable (pandas and torch only where the environment provides them; they are not requirements of the task); wall-clock limit 540 s. Score: mean absolute error on the official test split (log10 units; minimize); RMSE, R^2, Pearson and Spearman correlations and the MAE of the training-mean predictor are reported

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
