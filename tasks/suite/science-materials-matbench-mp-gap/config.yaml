# SCiEL / OpenEvolve configuration generated by scripts/build_new_tasks.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 3600
  max_retries: 2

prompt:
  system_message: |
    Matbench v0.1 mp_gap

    Predict the band gap of a crystal in eV, as calculated by density functional theory (PBE functional) from its crystal structure (Matbench v0.1 task mp_gap, 106113 samples). The evaluation uses the five official folds: for every fold the candidate is called once, in a separate process, with the other four folds and their target values as training data, and must predict the held-out fold within 600 seconds.

    Candidate interface: fit_predict(train_inputs, train_targets, test_inputs, info) -> list of len(test_inputs) numbers. Every input is a dict with the keys lattice (the three lattice vectors in angstrom, a 3 x 3 list), species (the element symbol of every site) and frac_coords (the fractional coordinates of every site). info has task, input_type, target, unit, fold, n_train and n_test. Score: mean over the five folds of the held-out mean absolute error, minimized.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
