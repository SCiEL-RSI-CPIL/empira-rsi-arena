# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 240
  max_retries: 2

prompt:
  system_message: |
    Earth science: Gutenberg-Richter b-value from incomplete earthquake catalogues

    Estimate the Gutenberg-Richter b-value and the magnitude of completeness of 600 synthetic earthquake catalogues whose small events are missed according to a realistic detection probability. The score is the mean absolute error of the estimated b-values against the generating values.

    Candidate interface: estimate_b_and_mc(catalogues) -> float array (600, 2) of [b-value, magnitude of completeness] for each catalogue. catalogues is a list of 600 float arrays of earthquake magnitudes reported in 0.1 bins. Each synthetic catalogue has Gutenberg-Richter magnitudes (b drawn from 0.6-1.4) starting 3 sigma below mu and thinned by the detection probability Phi((m - mu) / sigma) (mu from 0.5-3.0, sigma from 0.05-0.5), with 150-5000 detected events. The candidate runs in a separate sandboxed process (numpy, scipy, scikit-learn and pandas importable; no file, network or subprocess access; one thread) with 120 s of CPU time for fitting and all predictions together; seed any randomness so that results are deterministic. Score: mean absolute error of b over the 600 catalogues; lower is better. The completeness estimate is compared with the 95 percent detection magnitude mu + 1.645 sigma and reported but not scored. Wrong shapes, NaN, b outside [0.1, 3] or Mc outside [-2, 10] are invalid

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
