# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 240
  max_retries: 2

prompt:
  system_message: |
    Earth science: river nitrate loads from sparse samples

    Estimate daily nitrate concentrations in eight U.S. rivers from about 16 samples per year and continuous daily discharge, as in routine water-quality monitoring. The score is the error of the resulting monthly nitrate loads against loads computed from continuous in-situ nitrate sensors, which the candidate never sees.

    Candidate interface: estimate_nitrate(sites) -> dict {site_number: float array (n_days,)} of daily mean nitrate plus nitrite concentrations (mg/L as N, 0 to 100) for every day of each site's record. sites maps eight USGS site numbers to dicts with day (days since 1970-01-01, ascending, gaps where discharge is missing), decimal_year, discharge_m3s (daily mean discharge, m3/s, every day), sample_index (float indices into day of the sampled days: one random sensor day per calendar month plus four random days per water year with discharge in the site's top 20 percent), sample_nitrate_mg_l (the sensor daily means on those days), lat, lon and drainage_area_km2. Sensor concentrations on other days are never provided. The candidate runs in a separate sandboxed process (numpy, scipy, scikit-learn and pandas importable; no file, network or subprocess access; one thread) with 120 s of CPU time for fitting and all predictions together; seed any randomness so that results are deterministic. Score: mean over site-months (calendar months with at least 25 approved sensor days, 959 in all) of the absolute relative error (percent) of the monthly load sum(C * Q) over the sensor days, using the predicted instead of the sensor concentrations; lower is better. Missing sites, wrong shapes, NaN or values outside [0, 100] mg/L are invalid

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
