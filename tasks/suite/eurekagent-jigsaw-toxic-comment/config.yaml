# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 780
  max_retries: 2

prompt:
  system_message: |
    jigsaw-toxic-comment

    Write a Python fit_predict(train, test_inputs, time_budget_s) function that learns from 159,571 labelled Wikipedia comments of the Jigsaw toxic-comment competition and returns scores for six toxicity labels on its 63,978 scored test comments, within a 600 s wall-clock budget on 4 CPU threads without pretrained weights; scored by mean column-wise ROC AUC (higher is better).

    Candidate interface: fit_predict(train, test_inputs, time_budget_s) -> float array of shape (n_test, 6). train: pandas.DataFrame with columns id (str), comment_text (str) and the 0/1 int labels toxic, severe_toxic, obscene, threat, insult, identity_hate (159,571 Wikipedia talk-page comments, the competition training file); test_inputs: DataFrame with id and comment_text (the 63,978 competition test comments that were scored); return one finite score per comment and label, columns in that label order (only the ranking matters). time_budget_s = 600. fit_predict runs in a sandboxed child process: 4 CPU threads (thread settings of the numerical libraries, not an operating-system limit), no GPU, no network, no child processes, no pretrained weights or external data, reads limited to the Python installation and the task's public inputs, writes limited to a temporary working directory, memory limit 3.5 GB. time_budget_s wall-clock seconds start when the candidate's source starts executing in the child (imports and module-level code count); the process is killed 15 s after the budget (score: invalid). The evaluator holds the test labels and recomputes the metric; nothing the candidate reports is trusted. Score (maximize): mean over the six labels of the ROC AUC (MLE-bench grade.py)

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
