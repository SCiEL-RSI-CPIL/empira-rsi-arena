# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Integers up to 10^18 with many representations as sums of two powerful numbers

    construct() -> {'N': N, 'pairs': [[a, b], ...]} with 2 <= N <= 10^18 and between 1 and 1000 distinct pairs a <= b, a + b = N (a list of more than 1000 pairs is rejected, so the score is at most 1000), where a and b are powerful (every prime factor appears squared; 1 counts as powerful), checked by exact factorization. The score is the number of pairs, a certified lower bound on the representation count. Maximize. The cap of 1000 listed pairs is attainable: integers below 10^18 with more than 1000 representations as a sum of two squares exist, and squares are powerful. So 1000 is the maximum score and the task is a capped search exercise, not evidence on the conjectured subpolynomial bound.

    Candidate interface: construct() -> {'N': N, 'pairs': [[a, b], ...]} with 2 <= N <= 10^18 and between 1 and 1000 distinct pairs a <= b, a + b = N (a list of more than 1000 pairs is rejected, so the score is at most 1000), where a and b are powerful (every prime factor appears squared; 1 counts as powerful), checked by exact factorization. The score is the number of pairs, a certified lower bound on the representation count. Maximize.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
