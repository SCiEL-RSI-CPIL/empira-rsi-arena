# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Shortest superpermutation on seven symbols

    Write the shortest word over the symbols 1 to 7 that contains every one of the 5040 permutations of 1..7 as seven consecutive symbols. The shortest known word has 5905 symbols (A. Teodorescu, August 2026) and the best published lower bound is 5884.

    Candidate interface: construct(n) -> a word over the symbols 1..n, given as a string of the digits 1..n or a list of integers; the evaluator passes this task's n. Valid when every permutation of 1..n occurs as n consecutive symbols (every window is checked). Score: the length of the word, minimized; at most n * n! symbols.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
