# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 1800
  max_retries: 2

prompt:
  system_message: |
    LeetCode-Contest

    LeetCode-Contest task evaluated in CoCoEvo: Co-Evolution of Programs and Test Cases to Enhance Code Generation.

    Candidate interface: solve(question: str, llm) -> str. `question` is a LeetCode contest problem in CoCoEvo's format (function signature and statement with the examples removed) plus a request for the complete implementation; the last ```python block of the reply (else the whole reply) is executed. `llm(...)` is a budgeted, cached OpenRouter chat client. Each of the problem's tests calls the entry-point function in a fresh namespace of a resource-limited child process that sees only the call; the plain-data result must equal the expected value (Python == semantics). Score: pass@1, the fraction of a fixed 20-problem sample whose every test passes within 10 s of wall time per problem; higher is better

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
