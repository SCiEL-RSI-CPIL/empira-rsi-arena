# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 600
  max_retries: 2

prompt:
  system_message: |
    Finance: Index tracking with few stocks and transaction costs (OR-Library)

    Track five stock indices (Hang Seng, DAX 100, FTSE 100, S&P 100 and Nikkei 225) with buy-and-hold positions in at most ten constituents, formed from the first 145 weeks of prices and optionally rebalanced every 13 weeks at a 1% cost. The evaluator recomputes the portfolio values and scores the out-of-sample tracking error over the last 145 weeks.

    Candidate interface: rebalance(state) -> array of N target weights, or None to keep the current shares. Called at weeks 145, 158, ..., 288 (every 13 weeks) for each OR-Library market: Hang Seng (N = 31), DAX 100 (85), FTSE 100 (89), S&P 100 (98), Nikkei 225 (225). state = {'week': t, 'index_prices': (t+1,) weekly index levels for weeks 0..t, 'stock_prices': (t+1, N), 'holdings': (N,) shares held, 'portfolio_value': value before trading, 'K': 10, 'min_weight': 0.01, 'max_weight': 1.0, 'cost_rate': 0.01, 'rebalance_every': 13}. Weights: at most 10 stocks held (|w| <= 1e-12 counts as not held), each held weight in [0.01, 1], summing to 1; a portfolio is required at week 145. The first purchase is free, later trades pay 1% of the traded value, and shares are held fixed between rebalances. Score: out-of-sample tracking error, the root-mean-square difference between weekly log returns of the portfolio (net of costs) and of the index over weeks 146..290, in percent, averaged over the five markets (minimize). The candidate runs in a separate sandboxed process: numpy, scipy, scikit-learn, pandas and the other installed packages are importable, while the evaluator's library, its data files, the network and subprocesses are not accessible; one thread and 3 GB of memory. It receives only the arguments described here, one call at a time: the arguments of a call are sent after the value of the previous call has been received. Arguments and return values travel as numbers, strings, lists, dicts with string keys and numeric numpy arrays, so a tuple arrives as a list

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
