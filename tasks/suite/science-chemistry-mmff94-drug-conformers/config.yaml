# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 300
  max_retries: 2

prompt:
  system_message: |
    Lowest-energy MMFF94 conformers of eight drug molecules

    Find, for each of eight flexible drug molecules, the conformer with the lowest MMFF94 force-field energy while keeping the molecule's connectivity and stereochemistry. The evaluator recomputes the energy of the returned coordinates and compares it with minima from an extensive reference search.

    Candidate interface: conformer(molecule) -> array of shape (n_atoms, 3): Cartesian coordinates in Angstrom of every atom, in the atom order of Chem.AddHs(Chem.MolFromSmiles(molecule['smiles'])) (RDKit 2026.03). molecule = {'name', 'smiles', 'atoms' (element symbols in that order), 'formal_charges', 'bonds' ([i, j, bond order])}. Called for eight drugs (imatinib, sildenafil, atorvastatin, oseltamivir, tamoxifen, simvastatin, (S)-verapamil, (R)-ranolazine); all calls together within 300 s, at most 4 threads. The evaluator computes the MMFF94 energy (RDKit, no cutoff, dielectric 1) of exactly the returned coordinates; every bond must lie within 0.70-1.35 times the sum of covalent radii, non-bonded atoms at least 0.6 A apart, and the stereochemistry assigned from the 3D geometry must reproduce the given isomeric SMILES. Score: mean MMFF94 energy above reference minima found by an extensive local search (kcal/mol; minimize; negative = lower)

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
